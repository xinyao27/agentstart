<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not found — AgentStart</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.png" type="image/png" />
    <!--
      Why: this page has to render with no app bundle and no build step — it is the
      asset wrangler reaches for when nothing else matches, including when the
      bundle itself is what failed to upload. That is why the handful of tokens it
      needs are inline here rather than imported from src/index.css.
    -->
    <style>
      @font-face {
        font-family: 'Geist';
        src: url('/fonts/geist-variable.woff2') format('woff2');
        font-weight: 100 900;
        font-display: swap;
      }

      /* Why: dark is the base and `.light` is the opt-in, mirroring src/index.css,
         because this page has to honour the same stored choice as the site. A
         prefers-color-scheme media query alone would hand a visitor who picked
         dark a white page the moment they hit a broken link. */
      :root {
        --page: #181818;
        --ink: #c6c6c6;
        --copy: #848484;
        --faint: #515151;
        color-scheme: dark;
      }

      :root.light {
        --page: #ffffff;
        --ink: #242424;
        --copy: #616161;
        --faint: #9a9a9a;
        color-scheme: light;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--page);
        color: var(--copy);
        font-family:
          'Geist',
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        font-size: 16px;
        line-height: 26px;
        -webkit-font-smoothing: antialiased;
      }

      main {
        display: flex;
        flex-direction: column;
        gap: 12px;
        max-width: 420px;
      }

      h1 {
        margin: 0;
        color: var(--ink);
        font-size: 26px;
        line-height: 1.2;
        font-weight: 600;
      }

      p {
        margin: 0;
      }

      nav {
        display: flex;
        gap: 20px;
        margin-top: 12px;
      }

      a {
        color: var(--copy);
        text-decoration: underline;
        text-decoration-color: var(--faint);
        text-underline-offset: 3px;
      }

      a:hover {
        color: var(--ink);
        text-decoration-color: var(--ink);
      }
    </style>
    <script>
      // Why: the same pre-paint theme resolution as index.html, duplicated rather
      // than shared because this page must not depend on the bundle.
      try {
        var stored = localStorage.getItem('agentstart-theme')
        var light = stored
          ? stored === 'light'
          : !window.matchMedia('(prefers-color-scheme: dark)').matches
        document.documentElement.classList.toggle('light', light)
      } catch (error) {
        // Storage may be unavailable; the base dark theme still applies.
      }
    </script>
  </head>
  <body>
    <main>
      <h1>404</h1>
      <p>That page does not exist.</p>
      <nav>
        <a href="/">AgentStart</a>
        <a href="https://github.com/xinyao27/agentstart">GitHub</a>
      </nav>
    </main>
  </body>
</html>
