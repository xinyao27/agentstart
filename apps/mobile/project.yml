name: AgentStartMobile
options:
  bundleIdPrefix: com.xinyao27.agentstart
  createIntermediateGroups: true
  deploymentTarget:
    iOS: '26.0'
  developmentLanguage: en

settings:
  base:
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Why: release automation uses this as the default marketing version while allowing an exact
    # workflow override or a deliberate patch bump.
    MARKETING_VERSION: '1.0.0'
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_VERSION: '6.0'

packages:
  Sodium:
    url: https://github.com/jedisct1/swift-sodium.git
    exactVersion: 0.11.0
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.18.0
  Textual:
    url: https://github.com/gonzalezreal/textual.git
    exactVersion: 0.5.0
  Hugeicons:
    url: https://github.com/iSapozhnik/hugeicons-swift.git
    exactVersion: 4.1.7
  AgentStartProtocol:
    path: ../../packages/protocol/swift

schemes:
  AgentStartMobile:
    build:
      targets:
        AgentStartMobile: all
        AgentStartWidgets: all

targets:
  AgentStartMobile:
    type: application
    platform: iOS
    sources:
      - path: AgentStartMobile
        type: syncedFolder
        excludes:
          - '**/*.md'
          - 'Resources/agent-icons/**'
      - path: Shared/Widgets
      - path: AgentStartMobile/Resources/agent-icons
        type: folder
        buildPhase: resources
    dependencies:
      - package: Sodium
      - package: SwiftTerm
      - package: Textual
      - package: Hugeicons
      - package: AgentStartProtocol
      - target: AgentStartWidgets
    info:
      path: AgentStartMobile/Resources/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: AgentStart
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CADisableMinimumFrameDurationOnPhone: true
        CFBundleURLTypes:
          - CFBundleURLName: com.xinyao27.agentstart.mobile.pairing
            CFBundleURLSchemes:
              - agentstart
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Allow AgentStart to scan pairing QR codes.
        NSLocalNetworkUsageDescription: AgentStart connects directly to your daemon on the local network.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            100.64.0.0/10:
              NSExceptionAllowsInsecureHTTPLoads: true
            fd7a:115c:a1e0::/48:
              NSExceptionAllowsInsecureHTTPLoads: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: AgentStartMobile/Resources/AgentStartMobile.entitlements
        DEVELOPMENT_TEAM: 8H6Q2YA365
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.xinyao27.agentstart.mobile
        PRODUCT_NAME: AgentStart
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: '1,2'
  AgentStartWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AgentStartWidgets
        type: syncedFolder
      - path: Shared/Widgets
      - path: AgentStartMobile/DesignSystem/Icons
    info:
      path: AgentStartWidgets/Resources/Info.plist
      properties:
        CFBundleDisplayName: AgentStart Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: AgentStartWidgets/Resources/AgentStartWidgets.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: 8H6Q2YA365
        GENERATE_INFOPLIST_FILE: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.xinyao27.agentstart.mobile.Widgets
        PRODUCT_NAME: AgentStartWidgets
        SKIP_INSTALL: YES
        SUPPORTS_MACCATALYST: NO
        SWIFT_EMIT_LOC_STRINGS: YES
        TARGETED_DEVICE_FAMILY: '1,2'
    dependencies:
      - package: Hugeicons
