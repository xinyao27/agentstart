catalogMode: strict
catalogs:
  compatibility:
    react: '>=19'
    react-dom: '>=19'
    vite: '>=7'
  workbench:
    '@types/react': ^19.2.18
    '@xterm/addon-unicode11': 0.10.0-beta.287
    '@xterm/addon-webgl': 0.20.0-beta.286
    '@xterm/xterm': 6.1.0-beta.287
    react: ^19.2.8
    react-dom: ^19.2.8
    typescript: ^7.0.2
    zustand: ^5.0.15
  overrides:
    '@pierre/theming': 1.0.1
cleanupUnusedCatalogs: true
# Why: internal package versions also come through catalogs; matching workspace
# packages must still resolve to local source instead of the registry.
linkWorkspacePackages: true
# Why: @legendapp/list exposes an optional React Native peer, but this workspace uses only its
# browser entry point and the retired mobile stack must not return through dependency resolution.
ignoredOptionalDependencies:
  - react-native
# Why: the repository forbids dependency build allowlists; lockfile policy and exact workspace
# review are the trust boundary, so fresh installs must not silently skip required native binaries.
dangerouslyAllowAllBuilds: true
overrides:
  '@pierre/theming': catalog:overrides
  vite: 'catalog:'
# Why: vite is the Vite+ core alias, whose package version follows Vite+ rather than Vite's
# semver; pnpm also checks workspace catalog protocols literally when validating local peers.
peerDependencyRules:
  allowedVersions:
    '@agentstart/client>react': '19'
    '@agentstart/client>react-dom': '19'
    vite: 0.3.0
patchedDependencies:
  '@pierre/diffs@1.3.6': config/patches/@pierre__diffs@1.3.6.patch
  '@xterm/addon-ligatures@0.11.0-beta.287': config/patches/@xterm__addon-ligatures@0.11.0-beta.287.patch
  '@xterm/addon-serialize@0.15.0-beta.287': config/patches/@xterm__addon-serialize@0.15.0-beta.287.patch
  '@xterm/addon-webgl@0.20.0-beta.286': config/patches/@xterm__addon-webgl@0.20.0-beta.286.patch
supportedArchitectures:
  cpu:
    - current
    - x64
    - arm64
  os:
    - current
    - darwin
    - linux
    - win32
minimumReleaseAgeExclude:
  - oxlint-plugin-react-doctor@0.9.13
