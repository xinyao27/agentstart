name: Mobile Release

# Why: both supported entry points must resolve one explicit iOS marketing version before the
# workflow reads App Store state or builds the sole native mobile client.
on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Exact iOS marketing version, e.g. 1.0.0'
        required: true
        type: string
      testflight_distribution:
        description: 'TestFlight audience. Internal is the safe default; external uses
          the peeps group and may require Beta App Review.'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
      testflight_changelog:
        description: 'Optional external TestFlight tester changelog; ignored for
          internal uploads'
        required: false
        type: string

permissions:
  contents: read

# Why: setup installs the exact pinned pnpm binary; disabling its nested version manager keeps
# standalone and Node-distributed pnpm identities from rewriting the cross-platform lockfile.
env:
  PNPM_CONFIG_PM_ON_FAIL: ignore

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Resolve release request
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          REQUESTED_VERSION: ${{ github.event.inputs.release_version }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^mobile-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Mobile releases must run from an immutable mobile-vMAJOR.MINOR.PATCH tag.' >&2
            exit 1
          fi
          version="${RELEASE_TAG#mobile-v}"
          if [[ "$REQUESTED_VERSION" != "$version" ]]; then
            echo 'The requested marketing version must match the mobile release tag.' >&2
            exit 1
          fi
          echo "MOBILE_RELEASE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate TestFlight credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 APP_STORE_APP_ID \
            IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing iOS TestFlight credentials: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          if [[ "$APPLE_TEAM_ID" != '8H6Q2YA365' ]]; then
            echo 'APPLE_TEAM_ID does not identify the AgentStart Apple Developer team.' >&2
            exit 1
          fi
          if [[ "$APP_STORE_APP_ID" != '6810343597' ]]; then
            echo 'APP_STORE_APP_ID does not identify the AgentStart App Store record.' >&2
            exit 1
          fi
          echo 'iOS TestFlight credentials are configured'

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Resolve release version and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios prepare_release_version

      # Why: App Store Connect can issue profiles but cannot recreate the distribution
      # private key, so import the runner-only certificate into an ephemeral keychain.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/agentstart-ios-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/agentstart-ios-release-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          APP_STORE_APP_ID: ${{ secrets.APP_STORE_APP_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          TESTFLIGHT_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.testflight_distribution || 'internal' }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios release

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agentstart-mobile-ipa
          path: apps/mobile/build/*.ipa
          if-no-files-found: ignore
