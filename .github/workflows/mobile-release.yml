name: Mobile Release

# Why: preserve the established iOS release inputs, tag pattern, TestFlight audience behavior,
# and artifact contract while building the sole native mobile client.
on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      bump_patch_version:
        description: 'Bump the highest iOS marketing version found on the existing App
          Store app. Tick this after the current version has shipped (closed
          trains fail fast).'
        required: false
        default: false
        type: boolean
      release_version:
        description: 'Optional exact iOS marketing version override, e.g. 0.0.15'
        required: false
        default: '0.0.1'
        type: string
      testflight_distribution:
        description: 'TestFlight audience. Internal is the safe default; external uses
          the peeps group and may require Beta App Review.'
        required: true
        default: internal
        type: choice
        options:
          - internal
          - external
      testflight_changelog:
        description: 'Optional external TestFlight tester changelog; ignored for
          internal uploads'
        required: false
        type: string

permissions:
  contents: read

# Why: setup installs the exact pinned pnpm binary; disabling its nested version manager keeps
# standalone and Node-distributed pnpm identities from rewriting the cross-platform lockfile.
env:
  PNPM_CONFIG_PM_ON_FAIL: ignore

concurrency:
  group: mobile-release
  cancel-in-progress: false

jobs:
  ios-build:
    runs-on: macos-26
    timeout-minutes: 60

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Validate TestFlight credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_API_KEY_P8 \
            IOS_DIST_CERT_P12 IOS_DIST_CERT_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing iOS TestFlight credentials: %s\n' "${missing[*]}" >&2
            exit 1
          fi
          echo 'iOS TestFlight credentials are configured'

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Setup Ruby and fastlane
        uses: ruby/setup-ruby@v1.321.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: apps/mobile

      - name: Resolve release version and build number
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_BUMP_PATCH_VERSION: ${{ github.event.inputs.bump_patch_version }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios prepare_release_version

      # Why: App Store Connect can issue profiles but cannot recreate the distribution
      # private key, so import the runner-only certificate into an ephemeral keychain.
      - name: Import distribution certificate
        env:
          IOS_DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/yiru-ios-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          CERT_PATH="$RUNNER_TEMP/yiru-ios-release-cert.p12"

          echo "$IOS_DIST_CERT_P12" | base64 --decode > "$CERT_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db
          rm -f "$CERT_PATH"

      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
          MOBILE_RELEASE_VERSION: ${{ github.event.inputs.release_version }}
          MOBILE_BUMP_PATCH_VERSION: ${{ github.event.inputs.bump_patch_version }}
          TESTFLIGHT_DISTRIBUTION: ${{ github.event_name == 'workflow_dispatch' &&
            github.event.inputs.testflight_distribution || 'internal' }}
          TESTFLIGHT_CHANGELOG: ${{ github.event.inputs.testflight_changelog }}
          FASTLANE_SKIP_UPDATE_CHECK: '1'
          FASTLANE_HIDE_CHANGELOG: '1'
        run: bundle exec fastlane ios release

      - name: Upload .ipa artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: yiru-mobile-ipa
          path: apps/mobile/build/*.ipa
          if-no-files-found: ignore
