name: Mobile Checks

on:
  push:
    branches:
      - main
    paths:
      - 'apps/mobile/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

permissions:
  contents: read

# Why: setup installs the exact pinned pnpm binary; disabling its nested version manager keeps
# standalone and Node-distributed pnpm identities from rewriting the cross-platform lockfile.
env:
  PNPM_CONFIG_PM_ON_FAIL: ignore

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.5'

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json

      - name: Setup pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Verify iOS package
        run: pnpm exec vp run agentstart-mobile#check
