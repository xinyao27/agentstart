syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/repo.proto";

service ProjectGroupService {
  rpc List(ProjectGroupServiceListRequest) returns (ProjectGroupServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Create(ProjectGroupServiceCreateRequest) returns (ProjectGroupServiceGroupResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Update(ProjectGroupServiceUpdateRequest) returns (ProjectGroupServiceNullableGroupResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Delete(ProjectGroupServiceDeleteRequest) returns (ProjectGroupServiceDeleteResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc MoveProject(ProjectGroupServiceMoveProjectRequest) returns (ProjectGroupServiceMoveProjectResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ScanNested(ProjectGroupServiceScanNestedRequest) returns (ProjectGroupServiceScanNestedResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CancelNestedScan(ProjectGroupServiceCancelNestedScanRequest) returns (ProjectGroupServiceCancelNestedScanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ImportNested(ProjectGroupServiceImportNestedRequest) returns (ProjectGroupServiceImportNestedResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SubscribeEvents(ProjectGroupServiceSubscribeEventsRequest) returns (stream ProjectGroupServiceEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }
}

enum ProjectGroupCreatedFrom {
  PROJECT_GROUP_CREATED_FROM_UNSPECIFIED = 0;
  PROJECT_GROUP_CREATED_FROM_FOLDER_SCAN = 1;
  PROJECT_GROUP_CREATED_FROM_MANUAL = 2;
  PROJECT_GROUP_CREATED_FROM_MIGRATION = 3;
}

enum ProjectGroupImportMode {
  PROJECT_GROUP_IMPORT_MODE_UNSPECIFIED = 0;
  PROJECT_GROUP_IMPORT_MODE_GROUP = 1;
  PROJECT_GROUP_IMPORT_MODE_SEPARATE = 2;
}

enum ProjectGroupImportStatus {
  PROJECT_GROUP_IMPORT_STATUS_UNSPECIFIED = 0;
  PROJECT_GROUP_IMPORT_STATUS_ALREADY_KNOWN = 1;
  PROJECT_GROUP_IMPORT_STATUS_FAILED = 2;
  PROJECT_GROUP_IMPORT_STATUS_IMPORTED = 3;
}

message ProjectGroup {
  string id = 1;
  string name = 2;
  bool is_collapsed = 3;
  double tab_order = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  ProjectGroupCreatedFrom created_from = 7;
  optional string color = 8;
  optional string connection_id = 9;
  optional string parent_group_id = 10;
  optional string parent_path = 11;
}

message ProjectGroupServiceListRequest {}

message ProjectGroupServiceListResponse {
  repeated ProjectGroup groups = 1;
  int64 revision = 2;
}

message ProjectGroupServiceGroupResponse {
  ProjectGroup group = 1;
  int64 revision = 2;
}

message ProjectGroupServiceNullableGroupResponse {
  optional ProjectGroup group = 1;
  int64 revision = 2;
}

message ProjectGroupServiceDeleteResponse {
  bool deleted = 1;
  int64 revision = 2;
}

// Why: the legacy moveProject result returns the moved repository's catalog
// row with the subset of columns this authority owns, so it is modeled here
// rather than reusing the fuller `Repo` projection of the catalog service.
message ProjectGroupRepo {
  string id = 1;
  string path = 2;
  string display_name = 3;
  string badge_color = 4;
  string execution_host_id = 5;
  int64 added_at = 6;
  RepoKind kind = 7;
  RepoExternalWorktreeVisibility external_worktree_visibility = 8;
  optional string project_group_id = 9;
  optional double project_group_order = 10;
  optional RepoGitRemoteIdentity git_remote_identity = 11;
}

message ProjectGroupServiceMoveProjectResponse {
  ProjectGroupRepo repo = 1;
  int64 revision = 2;
}

message ProjectGroupScanOptions {
  optional uint32 max_depth = 1;
  optional uint32 max_repos = 2;
  optional int64 timeout_ms = 3;
}

message ProjectGroupServiceCreateRequest {
  int64 expected_revision = 1;
  string name = 2;
  optional string parent_path = 3;
  optional string parent_group_id = 4;
  optional string connection_id = 5;
  optional ProjectGroupCreatedFrom created_from = 6;
}

message ProjectGroupServiceUpdateFields {
  optional string name = 1;
  optional bool is_collapsed = 2;
  optional double tab_order = 3;
  // Why: color is cleared with an explicit null on the legacy surface, so the
  // nullable wrapper keeps "clear" distinct from "leave untouched".
  message NullableColor {
    oneof value {
      string text = 1;
      bool null = 2;
    }
  }
  optional NullableColor color = 4;
}

message ProjectGroupServiceUpdateRequest {
  int64 expected_revision = 1;
  string group_id = 2;
  ProjectGroupServiceUpdateFields updates = 3;
}

message ProjectGroupServiceDeleteRequest {
  int64 expected_revision = 1;
  string group_id = 2;
}

message ProjectGroupServiceMoveProjectRequest {
  int64 expected_revision = 1;
  string repo = 2;
  optional string group_id = 3;
  optional double order = 4;
}

message ProjectGroupNestedRepoCandidate {
  string path = 1;
  string display_name = 2;
  uint32 depth = 3;
}

message ProjectGroupServiceScanNestedRequest {
  string path = 1;
  optional string scan_id = 2;
  optional ProjectGroupScanOptions options = 3;
}

message ProjectGroupServiceScanNestedResponse {
  string selected_path = 1;
  string selected_path_kind = 2;
  repeated ProjectGroupNestedRepoCandidate repos = 3;
  uint32 max_depth = 4;
  uint32 max_repos = 5;
  int64 duration_ms = 6;
  bool stopped = 7;
  bool timed_out = 8;
  bool truncated = 9;
  optional int64 timeout_ms = 10;
}

message ProjectGroupServiceCancelNestedScanRequest {
  string scan_id = 1;
}

message ProjectGroupServiceCancelNestedScanResponse {
  bool cancelled = 1;
}

message ProjectGroupServiceImportProjectResult {
  string path = 1;
  ProjectGroupImportStatus status = 2;
  optional string project_id = 3;
  optional string error = 4;
}

message ProjectGroupServiceImportNestedRequest {
  int64 expected_revision = 1;
  string parent_path = 2;
  string group_name = 3;
  repeated string project_paths = 4;
  ProjectGroupImportMode mode = 5;
  optional string scan_id = 6;
}

message ProjectGroupServiceImportNestedResponse {
  int64 revision = 1;
  uint32 imported_count = 2;
  uint32 already_known_count = 3;
  uint32 failed_count = 4;
  repeated ProjectGroupServiceImportProjectResult projects = 5;
  optional ProjectGroup group = 6;
}

message ProjectGroupScanProgress {
  string scan_id = 1;
  ProjectGroupServiceScanNestedResponse scan = 2;
}

message ProjectGroupServiceSubscribeEventsRequest {}

message ProjectGroupServiceEvent {
  oneof event {
    ProjectGroupSubscribeReady ready = 1;
    ProjectGroupScanProgress progress = 2;
  }
}

message ProjectGroupSubscribeReady {
  string subscription_id = 1;
}
