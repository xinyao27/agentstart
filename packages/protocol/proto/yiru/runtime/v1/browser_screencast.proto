syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/browser.proto";

// Why: screencast is a forward call (CLI/workbench/mobile calls the daemon); the daemon relays
// to the Chrome authority over BrowserHostService.Execute internally, then re-streams frames to
// the original caller as ordinary protobuf server-stream messages. Cancelling the stream is the
// unsubscribe — there is no separate unsubscribe rpc, mirroring how Download has no cancel rpc.
service BrowserScreencastService {
  rpc Subscribe(BrowserScreencastSubscribeRequest) returns (stream BrowserScreencastEvent) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message BrowserScreencastSubscribeRequest {
  BrowserTarget target = 1;
  string format = 2;
  optional double quality = 3;
  optional double max_width = 4;
  optional double max_height = 5;
  optional double viewport_width = 6;
  optional double viewport_height = 7;
  optional double device_scale_factor = 8;
  optional bool mobile = 9;
  optional double every_nth_frame = 10;
  optional double min_frame_interval_ms = 11;
}

message BrowserScreencastReady {
  string subscription_id = 1;
  string browser_page_id = 2;
  string format = 3;
  string tab_url = 4;
  string tab_title = 5;
}

message BrowserScreencastFrameMetadata {
  optional double device_height = 1;
  optional double device_width = 2;
  optional double image_height = 3;
  optional double image_width = 4;
  optional double page_scale_factor = 5;
  optional double scroll_offset_x = 6;
  optional double scroll_offset_y = 7;
  optional double timestamp = 8;
}

message BrowserScreencastFrame {
  uint32 sequence = 1;
  string format = 2;
  BrowserScreencastFrameMetadata metadata = 3;
  bytes image = 4;
}

message BrowserScreencastEvent {
  oneof event {
    BrowserScreencastReady ready = 1;
    BrowserScreencastFrame frame = 2;
  }
}
