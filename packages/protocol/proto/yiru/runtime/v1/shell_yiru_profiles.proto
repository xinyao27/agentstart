syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service ShellYiruProfilesService {
  rpc List(ShellYiruProfilesServiceListRequest) returns (ShellYiruProfilesServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CreateLocal(ShellYiruProfilesServiceCreateLocalRequest) returns (ShellYiruProfilesServiceCreateResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SwitchProfile(ShellYiruProfilesServiceSwitchProfileRequest) returns (ShellYiruProfilesServiceSwitchResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc TransferProject(ShellYiruProfilesServiceTransferProjectRequest) returns (ShellYiruProfilesServiceTransferResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc FindProjectProfiles(ShellYiruProfilesServiceFindProjectProfilesRequest) returns (ShellYiruProfilesServiceFindResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum ShellYiruProfilesAvatarKind {
  SHELL_YIRU_PROFILES_AVATAR_KIND_UNSPECIFIED = 0;
  SHELL_YIRU_PROFILES_AVATAR_KIND_INITIALS = 1;
}

message ShellYiruProfilesAvatar {
  ShellYiruProfilesAvatarKind kind = 1;
  string initials = 2;
  string color = 3;
}

enum ShellYiruProfilesKind {
  SHELL_YIRU_PROFILES_KIND_UNSPECIFIED = 0;
  SHELL_YIRU_PROFILES_KIND_LOCAL = 1;
}

message ShellYiruProfilesProfile {
  string id = 1;
  string name = 2;
  ShellYiruProfilesAvatar avatar = 3;
  ShellYiruProfilesKind kind = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
  int64 last_opened_at = 7;
}

message ShellYiruProfilesServiceListRequest {}

message ShellYiruProfilesServiceListResponse {
  string active_profile_id = 1;
  repeated ShellYiruProfilesProfile profiles = 2;
  bool multi_profile_ui = 3;
}

message ShellYiruProfilesServiceCreateLocalRequest {
  optional string name = 1;
}

message ShellYiruProfilesServiceCreateResponse {
  string active_profile_id = 1;
  repeated ShellYiruProfilesProfile profiles = 2;
  ShellYiruProfilesProfile profile = 3;
}

enum ShellYiruProfilesSwitchStatus {
  SHELL_YIRU_PROFILES_SWITCH_STATUS_UNSPECIFIED = 0;
  SHELL_YIRU_PROFILES_SWITCH_STATUS_ALREADY_ACTIVE = 1;
  SHELL_YIRU_PROFILES_SWITCH_STATUS_RELAUNCHING = 2;
}

message ShellYiruProfilesServiceSwitchProfileRequest {
  string profile_id = 1;
}

message ShellYiruProfilesServiceSwitchResponse {
  ShellYiruProfilesSwitchStatus status = 1;
}

enum ShellYiruProfilesTransferMode {
  SHELL_YIRU_PROFILES_TRANSFER_MODE_UNSPECIFIED = 0;
  SHELL_YIRU_PROFILES_TRANSFER_MODE_MOVE = 1;
  SHELL_YIRU_PROFILES_TRANSFER_MODE_COPY = 2;
}

enum ShellYiruProfilesTransferStatus {
  SHELL_YIRU_PROFILES_TRANSFER_STATUS_UNSPECIFIED = 0;
  SHELL_YIRU_PROFILES_TRANSFER_STATUS_TRANSFERRED = 1;
  SHELL_YIRU_PROFILES_TRANSFER_STATUS_DUPLICATE_TARGET = 2;
}

message ShellYiruProfilesServiceTransferProjectRequest {
  string source_profile_id = 1;
  string target_profile_id = 2;
  string repo_id = 3;
  ShellYiruProfilesTransferMode mode = 4;
}

message ShellYiruProfilesServiceTransferResponse {
  ShellYiruProfilesTransferStatus status = 1;
  optional ShellYiruProfilesTransferMode mode = 2;
  string source_profile_id = 3;
  string target_profile_id = 4;
  string source_repo_id = 5;
  // Why: a duplicate-target result reports the colliding repo instead of a
  // new target id, so both stay optional rather than one carrying a placeholder.
  optional string target_repo_id = 6;
  optional string duplicate_repo_id = 7;
  optional string target_project_id = 8;
  optional bool will_relaunch = 9;
}

message ShellYiruProfilesServiceFindProjectProfilesRequest {
  string path = 1;
  optional string connection_id = 2;
  optional string execution_host_id = 3;
  optional string exclude_profile_id = 4;
}

message ShellYiruProfilesProjectPresence {
  string profile_id = 1;
  string profile_name = 2;
  ShellYiruProfilesKind profile_kind = 3;
  string repo_id = 4;
  string repo_name = 5;
}

message ShellYiruProfilesServiceFindResponse {
  repeated ShellYiruProfilesProjectPresence projects = 1;
}
