syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/github_shell.proto";

// GitHubService covers PR/issue reads, mutations, and hosted-review creation for the
// `github`, `githubCommentDraft`, and `hostedReview` legacy namespaces. GitHub is the only
// hosted-review provider Yiru supports; this service intentionally has no GitLab/Bitbucket/Gitea
// surface.
service GitHubService {
