// ---- Shared value types ----

message GitHubRepoRef {
  string owner = 1;
  string repo = 2;
}

message GitHubUser {
  string login = 1;
  optional string name = 2;
  string avatar_url = 3;
  optional string review_state = 4;
}

message GitHubMergeMethodSettings {
  string default_method = 1;
  bool merge_allowed = 2;
  bool squash_allowed = 3;
  bool rebase_allowed = 4;
}

enum GitHubChecksState {
  GIT_HUB_CHECKS_STATE_UNSPECIFIED = 0;
  GIT_HUB_CHECKS_STATE_NONE = 1;
  GIT_HUB_CHECKS_STATE_PENDING = 2;
  GIT_HUB_CHECKS_STATE_SUCCESS = 3;
  GIT_HUB_CHECKS_STATE_FAILURE = 4;
