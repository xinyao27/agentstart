  string repo_id = 2;
  uint64 number = 3;
}

message GitHubPrRefreshAlias {
  string cache_key = 1;
  string repo_id = 2;
  string repo_path = 3;
  string branch = 4;
  optional string connection_id = 5;
  optional string current_head_oid = 6;
  optional uint64 linked_pr_number = 7;
  optional uint64 fallback_pr_number = 8;
  optional GitHubPrRefreshFallbackSource fallback_pr_source = 9;
  optional string worktree_id = 10;
}

