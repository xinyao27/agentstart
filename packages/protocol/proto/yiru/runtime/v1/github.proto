message GitHubPrRefreshInFlight {
  double request_started_at_ms = 1;
}

message GitHubPrRefreshPaused {
  uint64 paused_until_ms = 1;
  string skipped_reason = 2;
}

message GitHubPrRefreshSkipped {
  string skipped_reason = 1;
}

message GitHubPrRefreshCompleted {
  GitHubRefreshOutcome outcome = 1;
  double request_started_at_ms = 2;
}

message GitHubPrRefreshEvent {
  uint64 sequence = 1;
  GitHubPrRefreshReason reason = 2;
  repeated GitHubPrRefreshAlias aliases = 3;
  oneof status {
    GitHubPrRefreshQueued queued = 4;
    GitHubPrRefreshInFlight in_flight = 5;
    GitHubPrRefreshPaused paused = 6;
    GitHubPrRefreshSkipped skipped = 7;
    GitHubPrRefreshCompleted completed = 8;
  }
}

message GitHubServiceSubscribeEventsResponse {
  oneof event {
    GitHubEventsSubscriptionReady ready = 1;
    GitHubWorkItemMutatedEvent work_item_mutated = 2;
    GitHubPrRefreshEvent pr_refresh = 3;
  }
}
