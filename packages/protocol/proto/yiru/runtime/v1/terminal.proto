// Why: one admitted duplex call owns all terminal routes; frame retains the existing
// epoch, flow-control, snapshot and PTY opcode encoding without per-frame RPCs.
message TerminalServiceMultiplexRequest {
  oneof content {
    string bulk_ticket = 1;
    bytes frame = 2;
  }
}

message TerminalMultiplexReady {}

message TerminalServiceMultiplexEvent {
  oneof content {
    TerminalMultiplexReady ready = 1;
    bytes frame = 2;
  }
}
