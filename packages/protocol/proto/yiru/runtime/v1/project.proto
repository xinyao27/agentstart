syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/repo.proto";

service ProjectService {
  rpc List(ProjectServiceListRequest) returns (ProjectServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Update(ProjectServiceUpdateRequest) returns (ProjectServiceUpdateResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

// Why: the catalog projects several physical repositories into one portable
// identity, so the wire carries that projection (id, sourceRepoIds, merged
// timestamps) rather than a single repository row like RepoService.
message Project {
  string id = 1;
  string display_name = 2;
  string badge_color = 3;
  ProjectKind kind = 4;
  optional RepoGitRemoteIdentity git_remote_identity = 5;
  optional ProjectProviderIdentity provider_identity = 6;
  optional ProjectRuntimePreference local_windows_runtime_preference = 7;
  // Why: the icon field is open-ended JSON in the catalog row (lucide name,
  // emoji, or image payload), so it keeps the typed recursive JSON shape.
  optional ProjectJsonValue repo_icon = 8;
  repeated string source_repo_ids = 9;
  int64 created_at = 10;
  int64 updated_at = 11;
}

enum ProjectKind {
  PROJECT_KIND_UNSPECIFIED = 0;
  PROJECT_KIND_FOLDER = 1;
  PROJECT_KIND_GIT = 2;
}

message ProjectProviderIdentity {
  string provider = 1;
  string owner = 2;
  string repo = 3;
}

// Why: the runtime preference is a discriminated union on the legacy surface
// (inherit-global | windows-host | wsl + distro), so a oneof keeps the
// variants from combining.
message ProjectRuntimePreference {
  oneof kind {
    bool inherit_global = 1;
    bool windows_host = 2;
    string wsl_distro = 3;
  }
}

message ProjectServiceListRequest {}

message ProjectServiceListResponse {
  repeated Project projects = 1;
  int64 revision = 2;
}

message ProjectServiceUpdateRequest {
  int64 expected_revision = 1;
  string project_id = 2;
  // Why: the legacy surface requires the updates object to be present even
  // when it carries no fields, so message presence guards that gate.
  ProjectServiceUpdateFields updates = 3;
}

message ProjectServiceUpdateFields {
  optional ProjectRuntimePreference local_windows_runtime_preference = 1;
}

message ProjectServiceUpdateResponse {
  Project project = 1;
  int64 revision = 2;
}

// Why: the same open-ended shape rule as SettingsJsonValue — a typed recursive
// JSON value instead of google.protobuf.Struct or a JSON string.
message ProjectJsonValue {
  oneof kind {
    ProjectJsonNull null_value = 1;
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    ProjectJsonValueList list_value = 5;
    ProjectJsonValueObject object_value = 6;
  }
}

enum ProjectJsonNull {
  PROJECT_JSON_NULL_UNSPECIFIED = 0;
  PROJECT_JSON_NULL_VALUE = 1;
}

message ProjectJsonValueList {
  repeated ProjectJsonValue values = 1;
}

message ProjectJsonValueObject {
  repeated ProjectJsonValueEntry entries = 1;
}

message ProjectJsonValueEntry {
  string key = 1;
  ProjectJsonValue value = 2;
}
