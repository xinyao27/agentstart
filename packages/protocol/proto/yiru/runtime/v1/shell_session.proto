syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service ShellSessionService {
  rpc Get(ShellSessionServiceGetRequest) returns (ShellSessionServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Watch(ShellSessionServiceGetRequest) returns (stream ShellSessionServiceGetResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }

  rpc Set(ShellSessionServiceSetRequest) returns (ShellSessionServiceMutatedResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Patch(ShellSessionServicePatchRequest) returns (ShellSessionServiceMutatedResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Flush(ShellSessionServiceFlushRequest) returns (ShellSessionServiceMutatedResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message ShellSessionServiceGetRequest {
  // Why: the authority partitions sessions per runtime host and "local" is the
  // default partition, so an unset host id and an empty one mean the same thing.
  optional string host_id = 1;
}

// Why: the durable WorkspaceSession document is schema-open by design — the
// authority strips unknown keys through a versioned schema with recursive
// references, so the wire carries it as a typed recursive JSON value rather
// than a closed message or google.protobuf.Struct (the SettingsJsonValue
// pattern).
message ShellSessionJsonValue {
  oneof kind {
    ShellSessionJsonNull null_value = 1;
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    ShellSessionJsonValueList list_value = 5;
    ShellSessionJsonValueObject object_value = 6;
  }
}

enum ShellSessionJsonNull {
  SHELL_SESSION_JSON_NULL_UNSPECIFIED = 0;
  SHELL_SESSION_JSON_NULL_VALUE = 1;
}

message ShellSessionJsonValueList {
  repeated ShellSessionJsonValue values = 1;
}

message ShellSessionJsonValueObject {
  repeated ShellSessionJsonValueEntry entries = 1;
}

message ShellSessionJsonValueEntry {
  string key = 1;
  ShellSessionJsonValue value = 2;
}

message ShellSessionServiceGetResponse {
  ShellSessionJsonValue session = 1;
  ShellSessionVersion version = 2;
}

message ShellSessionServiceSetRequest {
  optional string host_id = 1;
  ShellSessionJsonValue session = 2;
  ShellSessionVersion expected_version = 3;
}

message ShellSessionServicePatchRequest {
  optional string host_id = 1;
  // Why: a patch is an ordered set of key writes, so entries preserve caller
  // order where a protobuf map would sort it.
  repeated ShellSessionJsonValueEntry patch = 2;
  ShellSessionVersion expected_version = 3;
}

message ShellSessionServiceFlushRequest {}

message ShellSessionVersion {
  string epoch = 1;
  uint64 revision = 2;
}

message ShellSessionServiceMutatedResponse {
  ShellSessionVersion version = 1;
  ShellSessionJsonValue session = 2;
}
