syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service FeedbackService {
  rpc Submit(FeedbackServiceSubmitRequest) returns (FeedbackServiceSubmitResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message FeedbackServiceSubmitRequest {
  string feedback = 1;
  optional bool submit_anonymously = 2;
  optional string github_login = 3;
  optional string github_email = 4;
}

message FeedbackServiceSubmitResponse {
  bool ok = 1;
  optional int32 status = 2;
  optional string error = 3;
}
