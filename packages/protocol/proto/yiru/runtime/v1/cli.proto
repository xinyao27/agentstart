syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/host_registry.proto";

service CliService {
  rpc GetInstallStatus(CliServiceGetInstallStatusRequest) returns (CliServiceGetInstallStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Install(CliServiceInstallRequest) returns (CliServiceInstallResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Remove(CliServiceRemoveRequest) returns (CliServiceRemoveResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc GetWslInstallStatus(GetWslInstallStatusRequest) returns (GetWslInstallStatusResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc InstallWsl(InstallWslRequest) returns (InstallWslResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RemoveWsl(RemoveWslRequest) returns (RemoveWslResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message GetWslInstallStatusRequest {
  optional string distro = 1;
}

message CliServiceGetInstallStatusRequest {}

message CliServiceGetInstallStatusResponse {
  CliInstallStatus status = 1;
}

message CliServiceInstallRequest {}

message CliServiceInstallResponse {
  CliInstallStatus status = 1;
}

message CliServiceRemoveRequest {}

message CliServiceRemoveResponse {
  CliInstallStatus status = 1;
}

message GetWslInstallStatusResponse {
  CliInstallStatus status = 1;
}

message InstallWslRequest {
  optional string distro = 1;
}

message InstallWslResponse {
  CliInstallStatus status = 1;
}

message RemoveWslRequest {
  optional string distro = 1;
}

message RemoveWslResponse {
  CliInstallStatus status = 1;
}

message CliInstallStatus {
  HostPlatform platform = 1;
  string command_name = 2;
  optional string command_path = 3;
  optional string path_directory = 4;
  bool path_configured = 5;
  optional string launcher_path = 6;
  optional CliInstallMethod install_method = 7;
  bool supported = 8;
  CliInstallState state = 9;
  optional string current_target = 10;
  optional CliInstallUnsupportedReason unsupported_reason = 11;
  optional string detail = 12;
}

enum CliInstallState {
  CLI_INSTALL_STATE_UNSPECIFIED = 0;
  CLI_INSTALL_STATE_INSTALLED = 1;
  CLI_INSTALL_STATE_NOT_INSTALLED = 2;
  CLI_INSTALL_STATE_STALE = 3;
  CLI_INSTALL_STATE_CONFLICT = 4;
  CLI_INSTALL_STATE_UNSUPPORTED = 5;
}

enum CliInstallUnsupportedReason {
  CLI_INSTALL_UNSUPPORTED_REASON_UNSPECIFIED = 0;
  CLI_INSTALL_UNSUPPORTED_REASON_PLATFORM_NOT_SUPPORTED = 1;
  CLI_INSTALL_UNSUPPORTED_REASON_LAUNCHER_MISSING = 2;
  CLI_INSTALL_UNSUPPORTED_REASON_LAUNCH_MODE_UNAVAILABLE = 3;
}

enum CliInstallMethod {
  CLI_INSTALL_METHOD_UNSPECIFIED = 0;
  CLI_INSTALL_METHOD_SYMLINK = 1;
  CLI_INSTALL_METHOD_WRAPPER = 2;
}
