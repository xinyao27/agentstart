syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service ProgressEventsService {
  rpc Subscribe(ProgressEventsServiceSubscribeRequest) returns (stream ProgressEventsServiceEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }
}

message ProgressEventsServiceSubscribeRequest {}

message ProgressEventsSubscribeReady {
  string subscription_id = 1;
}

message ProgressEventsRepoCloneProgress {
  // Why: phases come from the clone pipeline's own vocabulary and grow with
  // it, so the wire keeps the string rather than an enum that would drift.
  string phase = 1;
  uint32 percent = 2;
}

message ProgressEventsServiceEvent {
  oneof event {
    ProgressEventsSubscribeReady ready = 1;
    ProgressEventsRepoCloneProgress repo_clone_progress = 2;
    bool end = 3;
  }
}
