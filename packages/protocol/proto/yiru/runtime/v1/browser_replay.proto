syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

// Why: replay recordings live in the daemon's own storage, keyed by project id only — no host
// crossing is ever required, so every rpc stays local-only.
service BrowserReplayService {
  rpc List(BrowserReplayServiceListRequest) returns (BrowserReplayServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RecordResult(BrowserReplayServiceRecordResultRequest)
      returns (BrowserReplayServiceRecordResultResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Save(BrowserReplayServiceSaveRequest) returns (BrowserReplayServiceSaveResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum BrowserReplayEventKind {
  BROWSER_REPLAY_EVENT_KIND_UNSPECIFIED = 0;
  BROWSER_REPLAY_EVENT_KIND_CLICK = 1;
  BROWSER_REPLAY_EVENT_KIND_INPUT = 2;
  BROWSER_REPLAY_EVENT_KIND_KEYDOWN = 3;
}

message BrowserReplayEvent {
  double at = 1;
  optional string key = 2;
  BrowserReplayEventKind kind = 3;
  string selector = 4;
  optional string value = 5;
}

message BrowserReplayRecording {
  int64 created_at = 1;
  double ended_at = 2;
  // Why: bounded at 20,000 entries, matching the legacy per-recording event cap.
  repeated BrowserReplayEvent events = 3;
  string id = 4;
  string page_title = 5;
  string page_url = 6;
  string project_id = 7;
  double started_at = 8;
  optional string video_artifact_id = 9;
}

message BrowserReplayServiceListRequest {
  string project_id = 1;
  optional uint32 limit = 2;
}
message BrowserReplayServiceListResponse { repeated BrowserReplayRecording recordings = 1; }

message BrowserReplayServiceRecordResultRequest {
  string detail = 1;
  string page_url = 2;
  string project_id = 3;
  string recording_id = 4;
  bool success = 5;
  string worktree_id = 6;
}
message BrowserReplayServiceRecordResultResponse { int64 event_id = 1; }

message BrowserReplayServiceSaveRequest {
  double ended_at = 1;
  repeated BrowserReplayEvent events = 2;
  string page_title = 3;
  string page_url = 4;
  string project_id = 5;
  double started_at = 6;
  optional string video_artifact_id = 7;
}
message BrowserReplayServiceSaveResponse { BrowserReplayRecording recording = 1; }
