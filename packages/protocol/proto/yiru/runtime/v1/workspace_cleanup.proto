syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service WorkspaceCleanupService {
  rpc Scan(WorkspaceCleanupServiceScanRequest) returns (WorkspaceCleanupServiceScanResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Dismiss(WorkspaceCleanupServiceDismissRequest) returns (WorkspaceCleanupServiceDismissalsResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ClearDismissals(WorkspaceCleanupServiceClearDismissalsRequest) returns (WorkspaceCleanupServiceDismissalsResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SubscribeEvents(WorkspaceCleanupServiceSubscribeEventsRequest) returns (stream WorkspaceCleanupServiceEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }
}

enum WorkspaceCleanupCandidateTier {
  WORKSPACE_CLEANUP_CANDIDATE_TIER_UNSPECIFIED = 0;
  WORKSPACE_CLEANUP_CANDIDATE_TIER_READY = 1;
  WORKSPACE_CLEANUP_CANDIDATE_TIER_REVIEW = 2;
  WORKSPACE_CLEANUP_CANDIDATE_TIER_PROTECTED = 3;
}

// Why: the git evidence fields are individually optional — an unknown upstream
// or a skipped git read must not flatten into a false zero — so they stay
// optional scalars instead of defaults.
message WorkspaceCleanupGitEvidence {
  optional bool clean = 1;
  optional int64 upstream_ahead = 2;
  optional int64 upstream_behind = 3;
  optional int64 checked_at = 4;
}

message WorkspaceCleanupLocalContext {
  uint32 terminal_tab_count = 1;
  uint32 clean_editor_tab_count = 2;
  uint32 browser_tab_count = 3;
  uint32 diff_comment_count = 4;
  optional int64 newest_diff_comment_at = 5;
  uint32 retained_done_agent_count = 6;
}

message WorkspaceCleanupCandidate {
  string worktree_id = 1;
  string repo_id = 2;
  string repo_name = 3;
  optional string connection_id = 4;
  string display_name = 5;
  string branch = 6;
  string path = 7;
  WorkspaceCleanupCandidateTier tier = 8;
  bool selected_by_default = 9;
  repeated string reasons = 10;
  repeated string blockers = 11;
  int64 last_activity_at = 12;
  WorkspaceCleanupLocalContext local_context = 13;
  WorkspaceCleanupGitEvidence git = 14;
  string fingerprint = 15;
  optional int64 created_at = 16;
}

message WorkspaceCleanupScanError {
  string repo_id = 1;
  string repo_name = 2;
  string message = 3;
}

message WorkspaceCleanupServiceScanRequest {
  optional string scan_id = 1;
  repeated string skip_git_worktree_ids = 2;
  optional string worktree_id = 3;
}

message WorkspaceCleanupServiceScanResponse {
  int64 scanned_at = 1;
  repeated WorkspaceCleanupCandidate candidates = 2;
  repeated WorkspaceCleanupScanError errors = 3;
}

message WorkspaceCleanupDismissal {
  string worktree_id = 1;
  string fingerprint = 2;
  double dismissed_at = 3;
  double classifier_version = 4;
}

message WorkspaceCleanupServiceDismissRequest {
  repeated WorkspaceCleanupDismissal dismissals = 1;
}

message WorkspaceCleanupServiceClearDismissalsRequest {}

// Why: the authority persists dismissals keyed by worktree id, so the response
// repeats the surviving entries instead of a count the caller cannot reconcile.
message WorkspaceCleanupServiceDismissalsResponse {
  repeated WorkspaceCleanupDismissal dismissals = 1;
}

message WorkspaceCleanupServiceSubscribeEventsRequest {}

message WorkspaceCleanupScanProgress {
  string scan_id = 1;
  int64 scanned_at = 2;
  repeated WorkspaceCleanupCandidate candidates = 3;
  repeated WorkspaceCleanupScanError errors = 4;
  uint32 scanned_worktree_count = 5;
  uint32 total_worktree_count = 6;
  string candidate_mode = 7;
}

message WorkspaceCleanupServiceEvent {
  oneof event {
    WorkspaceCleanupSubscribeReady ready = 1;
    WorkspaceCleanupScanProgress progress = 2;
  }
}

message WorkspaceCleanupSubscribeReady {
  string subscription_id = 1;
}
