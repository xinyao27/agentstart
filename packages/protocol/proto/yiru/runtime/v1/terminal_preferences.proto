syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service TerminalPreferencesService {
  rpc GetAutoRestoreFit(GetAutoRestoreFitRequest) returns (GetAutoRestoreFitResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SetAutoRestoreFit(SetAutoRestoreFitRequest) returns (SetAutoRestoreFitResponse) {
    option idempotency_level = IDEMPOTENT;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message GetAutoRestoreFitRequest {}

message GetAutoRestoreFitResponse {
  optional double milliseconds = 1;
}

message SetAutoRestoreFitRequest {
  optional double milliseconds = 1;
}

message SetAutoRestoreFitResponse {
  optional double milliseconds = 1;
}
