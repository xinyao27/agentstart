syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service DriverEventsService {
  rpc Subscribe(DriverEventsServiceSubscribeRequest) returns (stream DriverEventsServiceEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }
}

message DriverEventsServiceSubscribeRequest {}

message DriverEventsSubscribeReady {
  string subscription_id = 1;
}

// Why: the driver channel carries the terminal's own event vocabulary rather
// than a per-subscription document, so every stream item is one of the closed
// event kinds as a oneof instead of a JSON envelope.
message DriverEventsServiceEvent {
  oneof event {
    DriverEventsSubscribeReady ready = 1;
    DriverEventsTerminalDriverChanged terminal_driver_changed = 2;
    DriverEventsTerminalFitOverrideChanged terminal_fit_override_changed = 3;
    bool end = 4;
  }
}

message DriverEventsTerminalDriverChanged {
  string pty_id = 1;
  DriverEventsTerminalDriver driver = 2;
}

// Why: the driver state is a closed three-way union (idle, desktop, or a
// named mobile client), so a oneof keeps it from combining.
message DriverEventsTerminalDriver {
  oneof state {
    bool idle = 1;
    bool desktop = 2;
    string mobile_client_id = 3;
  }
}

message DriverEventsTerminalFitOverrideChanged {
  string pty_id = 1;
  DriverEventsFitOverrideMode mode = 2;
  uint32 cols = 3;
  uint32 rows = 4;
}

enum DriverEventsFitOverrideMode {
  DRIVER_EVENTS_FIT_OVERRIDE_MODE_UNSPECIFIED = 0;
  DRIVER_EVENTS_FIT_OVERRIDE_MODE_MOBILE_FIT = 1;
  DRIVER_EVENTS_FIT_OVERRIDE_MODE_DESKTOP_FIT = 2;
}
