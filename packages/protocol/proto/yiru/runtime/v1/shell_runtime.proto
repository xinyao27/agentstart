syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";
import "yiru/runtime/v1/status.proto";

// Why: the legacy syncWindowGraph procedure admits only the local principal
// (`principals: ["local"]`) from the Chrome workbench, so the policy is
// narrower than the runtime-routed services and must stay that way.
service ShellRuntimeService {
  rpc SyncWindowGraph(ShellRuntimeServiceSyncWindowGraphRequest) returns (GetStatusResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message ShellRuntimeServiceSyncWindowGraphRequest {
  // Why: the renderer window graph is a bounded open document (tabs, leaves,
  // mobile session snapshots) the authority validates structurally but does
  // not own field-by-field, so it travels as a typed recursive JSON value.
  ShellRuntimeJsonValue graph = 1;
}

// Why: the same open-ended shape rule as SettingsJsonValue — a typed recursive
// JSON value instead of google.protobuf.Struct or a JSON string.
message ShellRuntimeJsonValue {
  oneof kind {
    ShellRuntimeJsonNull null_value = 1;
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    ShellRuntimeJsonValueList list_value = 5;
    ShellRuntimeJsonValueObject object_value = 6;
  }
}

enum ShellRuntimeJsonNull {
  SHELL_RUNTIME_JSON_NULL_UNSPECIFIED = 0;
  SHELL_RUNTIME_JSON_NULL_VALUE = 1;
}

message ShellRuntimeJsonValueList {
  repeated ShellRuntimeJsonValue values = 1;
}

message ShellRuntimeJsonValueObject {
  repeated ShellRuntimeJsonValueEntry entries = 1;
}

message ShellRuntimeJsonValueEntry {
  string key = 1;
  ShellRuntimeJsonValue value = 2;
}
