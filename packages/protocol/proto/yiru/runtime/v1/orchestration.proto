message OrchestrationServiceFederationAckResponse {
  string dispatch_id = 1;
  int64 acknowledged_through = 2;
  optional OrchestrationMutation mutation = 3;
}

message OrchestrationFederationImportItem {
  string dispatch_id = 1;
  int64 sequence = 2;
  string message_id = 3;
  string kind = 4;
  string payload = 5;
}

message OrchestrationServiceFederationImportRequest {
  string dispatch_id = 1;
  repeated OrchestrationFederationImportItem items = 2;
}

message OrchestrationServiceFederationImportResponse {
  string dispatch_id = 1;
  int64 acknowledged_through = 2;
  uint64 imported = 3;
  optional OrchestrationMutation mutation = 4;
}

message OrchestrationServiceFederationShowRequest {
  string dispatch_id = 1;
}

message OrchestrationServiceFederationShowResponse {
  string dispatch_id = 1;
  string runtime_epoch = 2;
  OrchestrationRemoteAttachment attachment = 3;
  optional OrchestrationWorkerTerminal terminal = 4;
  OrchestrationWorkerObservation observation = 5;
}

message OrchestrationServiceFederationReadRequest {
  string dispatch_id = 1;
  optional string cursor = 2;
  optional int64 limit = 3;
}

message OrchestrationServiceFederationReadResponse {
  string dispatch_id = 1;
  string runtime_epoch = 2;
  TerminalRead terminal = 3;
}

message OrchestrationServiceFederationReadOutputRequest {
  string dispatch_id = 1;
  optional string cursor = 2;
  optional int64 limit = 3;
  optional OrchestrationWorkerReadSource source = 4;
}

message OrchestrationServiceFederationReadOutputResponse {
  string dispatch_id = 1;
  string runtime_epoch = 2;
  OrchestrationWorkerReadResult output = 3;
}

message OrchestrationServiceFederationStopRequest {
  string dispatch_id = 1;
}

message OrchestrationServiceFederationStopResponse {
  string dispatch_id = 1;
  OrchestrationWorkerState state = 2;
  bool already_settled = 3;
  OrchestrationWorkerProcessAction process_action = 4;
  optional OrchestrationWorkerStopClose close = 5;
  optional string last_error = 6;
  optional OrchestrationMutation mutation = 7;
}
