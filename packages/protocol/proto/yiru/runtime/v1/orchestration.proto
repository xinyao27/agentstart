// ---------------------------------------------------------------------------
// Shared value types
// ---------------------------------------------------------------------------

message OrchestrationMutation {
  string request_id = 1;
  bool replayed = 2;
}

// Why: a scalar-only leaf so a heterogeneous, daemon-authored record (a worker-start effect, a
// residual resource, a worker's stored start options) stays a real typed wire value instead of
// google.protobuf.Struct — every field these records carry today (kind/action/id/state/role/...)
// is a bool, integer, double, or string.
message OrchestrationFieldValue {
  oneof value {
    bool boolean = 1;
    int64 integer = 2;
    double number = 3;
    string text = 4;
  }
}

message OrchestrationFieldEntry {
  string key = 1;
  OrchestrationFieldValue value = 2;
}

message OrchestrationEffect {
  string kind = 1;
  repeated OrchestrationFieldEntry fields = 2;
}

message OrchestrationRun {
  string id = 1;
  string objective = 2;
  string home_database = 3;
  optional string coordinator_handle = 4;
  optional string coordinator_pane_key = 5;
  int64 consumer_generation = 6;
  bool legacy = 7;
  string created_at = 8;
  string updated_at = 9;
}

message OrchestrationRunBinding {
  int64 consumer_generation = 1;
}

message OrchestrationTask {
  string id = 1;
  string run_id = 2;
  optional string parent_id = 3;
  optional string created_by_terminal_handle = 4;
  optional string task_title = 5;
  optional string display_name = 6;
  string spec = 7;
  OrchestrationTaskStatus status = 8;
  repeated string deps = 9;
  // Why: the daemon never interprets --result; it is an opaque caller-supplied JSON blob stored
  // and echoed verbatim (see task_update in apps/daemon/src/orchestration/authority.rs).
  optional string result = 10;
  string created_at = 11;
  optional string completed_at = 12;
  optional string assignee_handle = 13;
  optional string dispatch_id = 14;
  bool spec_truncated = 15;
}

message OrchestrationDispatch {
  string id = 1;
  string run_id = 2;
  string task_id = 3;
  optional string assignee_handle = 4;
  optional string assignee_pane_key = 5;
  optional string capability_hash = 6;
  optional string process_incarnation = 7;
  optional string capability_revoked_at = 8;
  OrchestrationDispatchStatus status = 9;
  int64 failure_count = 10;
  optional string last_failure = 11;
  optional string dispatched_at = 12;
  optional string completed_at = 13;
  string created_at = 14;
  optional string last_heartbeat_at = 15;
}

message OrchestrationMessage {
  string id = 1;
  string run_id = 2;
  string from_handle = 3;
  string to_handle = 4;
  string subject = 5;
  string body = 6;
  OrchestrationMessageType type = 7;
  OrchestrationMessagePriority priority = 8;
  optional string thread_id = 9;
  // Why: opaque caller/daemon-defined payload (heartbeat phase, worker_done outcome, ask
  // question/options, or a free-form `--payload <json>`) — stored and forwarded as-is, never
  // schema-validated by the daemon; see reconcile_lifecycle's ad-hoc field reads.
  optional string payload = 10;
  bool read = 11;
  int64 sequence = 12;
  string created_at = 13;
  optional string delivered_at = 14;
  optional string sender_pane_key = 15;
}

message OrchestrationQuestion {
  string message_id = 1;
  string run_id = 2;
  string dispatch_id = 3;
  string asker_handle = 4;
  OrchestrationQuestionStatus status = 5;
  optional string answer_message_id = 6;
  optional string answer_body = 7;
  optional int64 answered_by_generation = 8;
  string created_at = 9;
  optional string answered_at = 10;
  optional string closed_at = 11;
}

message OrchestrationGate {
  string id = 1;
  string run_id = 2;
  string task_id = 3;
  string question = 4;
  repeated string options = 5;
  OrchestrationGateStatus status = 6;
  optional string resolution = 7;
  string created_at = 8;
  optional string resolved_at = 9;
}

message OrchestrationWorkerSetupReceipt {
  OrchestrationWorkerSetupMode requested = 1;
  OrchestrationWorkerSetupMode effective = 2;
  string source = 3;
  bool hook_found = 4;
  string startup_policy = 5;
  string state = 6;
}

message OrchestrationWorkerObservation {
  string status = 1;
  bool exact_worker = 2;
}

message OrchestrationWorkerTerminal {
  TerminalSummary summary = 1;
  int64 pane_runtime_id = 2;
  uint64 renderer_graph_epoch = 3;
  string transport_generation = 4;
}

message OrchestrationServerRef {
  optional string environment_id = 1;
  string name = 2;
}

message OrchestrationWorker {
  string dispatch_id = 1;
  optional string runtime_epoch = 2;
  OrchestrationWorkerState state = 3;
  string stage = 4;
  optional string worktree_id = 5;
  optional string agent_terminal_handle = 6;
  string setup_state = 7;
  repeated OrchestrationEffect effects = 8;
  repeated OrchestrationEffect residual_resources = 9;
  repeated OrchestrationFieldEntry start_options = 10;
  optional string last_error = 11;
  string created_at = 12;
  string updated_at = 13;
}

message OrchestrationRemoteAttachment {
  string dispatch_id = 1;
  string task_id = 2;
  string home_peer_fingerprint = 3;
  int64 protocol_version = 4;
  string runtime_epoch = 5;
  optional string capability_hash = 6;
  optional string pane_key = 7;
  optional string process_incarnation = 8;
  OrchestrationWorkerState state = 9;
  string stage = 10;
  optional string worktree_id = 11;
  optional string terminal_handle = 12;
  string setup_state = 13;
  repeated OrchestrationEffect effects = 14;
  repeated OrchestrationEffect residual_resources = 15;
  int64 to_worker_imported_sequence = 16;
  optional string last_error = 17;
  string created_at = 18;
  string updated_at = 19;
}

message OrchestrationFederationRelayItem {
  string dispatch_id = 1;
  string direction = 2;
  int64 sequence = 3;
  string message_id = 4;
  string kind = 5;
  string payload = 6;
  int64 byte_count = 7;
  optional string acked_at = 8;
  string created_at = 9;
}

// Why: the one shape worker-read/federation-read-output can currently produce (`read_worker_terminal`
// in apps/daemon/src/orchestration/authority/workers.rs never reaches the transcript branch);
// the transcript source stays reserved on OrchestrationWorkerReadSource for when that path is wired.
message OrchestrationWorkerReadResult {
  string dispatch_id = 1;
  TerminalRead terminal = 2;
  optional string cursor = 3;
  string worker_state = 4;
  string fallback_reason = 5;
  repeated string warnings = 6;
}

message OrchestrationWorkerStopClose {
  string handle = 1;
  bool was_running = 2;
}

