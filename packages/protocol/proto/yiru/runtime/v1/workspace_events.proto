syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service WorkspaceEventsService {
  rpc GetProjectRevision(WorkspaceEventsServiceGetProjectRevisionRequest) returns (WorkspaceEventsServiceGetProjectRevisionResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc AppendConsole(WorkspaceEventsServiceAppendConsoleRequest) returns (WorkspaceEventsServiceAppendConsoleResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc AppendPerformance(WorkspaceEventsServiceAppendPerformanceRequest) returns (WorkspaceEventsServiceAppendPerformanceResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc List(WorkspaceEventsServiceListRequest) returns (WorkspaceEventsServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  // Resumable journal tail: the request carries the last event the caller
  // already applied, so a replaced routed transport restarts the stream from
  // that cursor instead of replaying the whole journal.
  rpc Watch(WorkspaceEventsServiceWatchRequest) returns (stream WorkspaceEventsServiceWatchResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }
}

message WorkspaceEventsServiceGetProjectRevisionRequest {
  string project_id = 1;
}

message WorkspaceEventsServiceAppendConsoleRequest {
  string project_id = 1;
  string worktree_id = 2;
  string page_url = 3;
  repeated WorkspaceConsoleEntry entries = 4;
}

enum WorkspaceConsoleSource {
  WORKSPACE_CONSOLE_SOURCE_UNSPECIFIED = 0;
  WORKSPACE_CONSOLE_SOURCE_CONSOLE = 1;
  WORKSPACE_CONSOLE_SOURCE_EXCEPTION = 2;
  WORKSPACE_CONSOLE_SOURCE_LOG = 3;
}

message WorkspaceConsoleEntry {
  double occurred_at = 1;
  WorkspaceConsoleSource source = 2;
  string text = 3;
  optional string stack = 4;
}

message WorkspaceEventsServiceAppendConsoleResponse {
  optional string claimed_terminal_handle = 1;
  uint32 events_appended = 2;
}

message WorkspaceEventsServiceAppendPerformanceRequest {
  string project_id = 1;
  string worktree_id = 2;
  string page_url = 3;
  string artifact_id = 4;
  uint32 metric_count = 5;
}

message WorkspaceEventsServiceAppendPerformanceResponse {
  WorkspaceEvent event = 1;
}

message WorkspaceEventsServiceGetProjectRevisionResponse {
  uint64 revision = 1;
}

message WorkspaceEventsServiceListRequest {
  string scope = 1;
  optional int64 after_id = 2;
  optional uint32 limit = 3;
}

message WorkspaceEventsServiceListResponse {
  repeated WorkspaceEvent events = 1;
  int64 latest_id = 2;
  int64 revision = 3;
}

message WorkspaceEventsServiceWatchRequest {
  string scope = 1;
  optional int64 after_id = 2;
}

message WorkspaceEventsServiceWatchResponse {
  oneof event {
    WorkspaceWatchReady ready = 1;
    WorkspaceEvent appended = 2;
  }
}

// Opens the stream with the scope revision the tail starts from, and echoes the
// cursor the daemon resumed at so a caller can tell a resume from a cold start.
message WorkspaceWatchReady {
  int64 revision = 1;
  int64 after_id = 2;
}

message WorkspaceEvent {
  int64 id = 1;
  string kind = 2;
  int64 occurred_at = 3;
  // Ordered so the journal payload keeps the key order it was written with; a
  // protobuf map would reorder it.
  repeated WorkspaceEventPayloadEntry payload = 4;
  int64 revision = 5;
  string scope = 6;
}

message WorkspaceEventPayloadEntry {
  string key = 1;
  WorkspaceEventValue value = 2;
}

// A payload value is a JSON scalar. An unset `value` is JSON null, which the
// journal stores and the workbench reads back.
message WorkspaceEventValue {
  oneof value {
    bool boolean = 1;
    double number = 2;
    string text = 3;
  }
}
