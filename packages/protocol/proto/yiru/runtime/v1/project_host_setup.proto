syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

// Why: setup creation, import, clone, and update drive the daemon host's own
// project catalog and execution-host filesystem, while list and delete are
// project-scoped catalog reads and tombstones — the scope split mirrors the
// generated legacy contract instead of flattening to one scope.
service ProjectHostSetupService {
  rpc List(ProjectHostSetupServiceListRequest) returns (ProjectHostSetupServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Create(ProjectHostSetupServiceCreateRequest) returns (ProjectHostSetupServiceMutationResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SetupExistingFolder(ProjectHostSetupServiceSetupExistingFolderRequest) returns (ProjectHostSetupServiceMutationResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Clone(ProjectHostSetupServiceCloneRequest) returns (ProjectHostSetupServiceMutationResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Update(ProjectHostSetupServiceUpdateRequest) returns (ProjectHostSetupServiceMutationResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Delete(ProjectHostSetupServiceDeleteRequest) returns (ProjectHostSetupServiceMutationResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum ProjectHostSetupKind {
  PROJECT_HOST_SETUP_KIND_UNSPECIFIED = 0;
  PROJECT_HOST_SETUP_KIND_FOLDER = 1;
  PROJECT_HOST_SETUP_KIND_GIT = 2;
}

enum ProjectHostSetupState {
  PROJECT_HOST_SETUP_STATE_UNSPECIFIED = 0;
  PROJECT_HOST_SETUP_STATE_READY = 1;
  PROJECT_HOST_SETUP_STATE_NOT_SET_UP = 2;
  PROJECT_HOST_SETUP_STATE_SETTING_UP = 3;
  PROJECT_HOST_SETUP_STATE_ERROR = 4;
  PROJECT_HOST_SETUP_STATE_UNSUPPORTED = 5;
}

enum ProjectHostSetupMethod {
  PROJECT_HOST_SETUP_METHOD_UNSPECIFIED = 0;
  PROJECT_HOST_SETUP_METHOD_CLONED = 1;
  PROJECT_HOST_SETUP_METHOD_IMPORTED_EXISTING_FOLDER = 2;
  PROJECT_HOST_SETUP_METHOD_LEGACY_REPO = 3;
  PROJECT_HOST_SETUP_METHOD_PROVISIONED = 4;
}

enum ProjectHostSetupWorktreeVisibility {
  PROJECT_HOST_SETUP_WORKTREE_VISIBILITY_UNSPECIFIED = 0;
  PROJECT_HOST_SETUP_WORKTREE_VISIBILITY_HIDE = 1;
  PROJECT_HOST_SETUP_WORKTREE_VISIBILITY_SHOW = 2;
}

message ProjectHostSetupGitRemoteIdentity {
  string canonical_key = 1;
  string remote_name = 2;
  string remote_url = 3;
}

message ProjectHostSetupGithubIdentity {
  string owner = 1;
  string repo = 2;
}

message ProjectHostSetupProviderIdentity {
  string provider = 1;
  string owner = 2;
  string repo = 3;
}

// Why: the portable project carries a Windows runtime preference whose WSL
// branch holds a distro name, so a oneof models the three legacy variants
// instead of three nullable fields.
message ProjectHostSetupWindowsRuntimePreference {
  oneof preference {
    bool inherit_global = 1;
    bool windows_host = 2;
    string wsl_distro = 3;
  }
}

// Why: the legacy `repoIcon` value is open-shaped theme input the Rust catalog
// does not yet own, so a typed recursive JSON value keeps it honest without
// google.protobuf.Struct or a JSON string (the same pattern SettingsJsonValue
// established).
message ProjectHostSetupJsonValue {
  oneof kind {
    ProjectHostSetupJsonNull null_value = 1;
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    ProjectHostSetupJsonValueList list_value = 5;
    ProjectHostSetupJsonValueObject object_value = 6;
  }
}

enum ProjectHostSetupJsonNull {
  PROJECT_HOST_SETUP_JSON_NULL_UNSPECIFIED = 0;
  PROJECT_HOST_SETUP_JSON_NULL_VALUE = 1;
}

message ProjectHostSetupJsonValueList {
  repeated ProjectHostSetupJsonValue values = 1;
}

message ProjectHostSetupJsonValueObject {
  repeated ProjectHostSetupJsonValueEntry entries = 1;
}

message ProjectHostSetupJsonValueEntry {
  string key = 1;
  ProjectHostSetupJsonValue value = 2;
}

message ProjectHostSetupProject {
  string badge_color = 1;
  int64 created_at = 2;
  string display_name = 3;
  optional ProjectHostSetupGitRemoteIdentity git_remote_identity = 4;
  string id = 5;
  optional ProjectHostSetupKind kind = 6;
  optional ProjectHostSetupWindowsRuntimePreference local_windows_runtime_preference = 7;
  optional ProjectHostSetupProviderIdentity provider_identity = 8;
  optional ProjectHostSetupJsonValue repo_icon = 9;
  repeated string source_repo_ids = 10;
  int64 updated_at = 11;
}

message ProjectHostSetupRecord {
  int64 created_at = 1;
  string display_name = 2;
  optional string execution_host_id = 3;
  optional string git_username = 4;
  string host_id = 5;
  string id = 6;
  optional ProjectHostSetupKind kind = 7;
  string path = 8;
  string project_id = 9;
  string repo_id = 10;
  ProjectHostSetupMethod setup_method = 11;
  ProjectHostSetupState setup_state = 12;
  int64 updated_at = 13;
  optional string worktree_base_path = 14;
}

message ProjectHostSetupRepo {
  int64 added_at = 1;
  string badge_color = 2;
  string display_name = 3;
  string execution_host_id = 4;
  ProjectHostSetupWorktreeVisibility external_worktree_visibility = 5;
  optional ProjectHostSetupGitRemoteIdentity git_remote_identity = 6;
  string id = 7;
  ProjectHostSetupKind kind = 8;
  string path = 9;
  optional ProjectHostSetupMethod project_host_setup_method = 10;
  optional ProjectHostSetupGithubIdentity upstream = 11;
  optional string worktree_base_path = 12;
}

message ProjectHostSetupServiceListRequest {}

message ProjectHostSetupServiceListResponse {
  int64 revision = 1;
  repeated ProjectHostSetupRecord setups = 2;
}

message ProjectHostSetupServiceCreateRequest {
  int64 expected_revision = 1;
  string project_id = 2;
  string host_id = 3;
  optional string display_name = 4;
  optional string git_username = 5;
  optional ProjectHostSetupKind kind = 6;
  optional string path = 7;
  optional string setup_id = 8;
  optional ProjectHostSetupMethod setup_method = 9;
  optional ProjectHostSetupState setup_state = 10;
  optional string worktree_base_path = 11;
}

message ProjectHostSetupServiceSetupExistingFolderRequest {
  int64 expected_revision = 1;
  string project_id = 2;
  string host_id = 3;
  string path = 4;
  optional ProjectHostSetupKind kind = 5;
  optional ProjectHostSetupMethod setup_method = 6;
}

message ProjectHostSetupServiceCloneRequest {
  int64 expected_revision = 1;
  string project_id = 2;
  string host_id = 3;
  string url = 4;
  string destination = 5;
}

message ProjectHostSetupServiceUpdateRequest {
  int64 expected_revision = 1;
  string setup_id = 2;
  ProjectHostSetupUpdates updates = 3;
}

// Why: `updates` patches only the fields the caller sets, so every field is
// optional and the authority decides between "unset" and "no change".
message ProjectHostSetupUpdates {
  optional string display_name = 1;
  optional string git_username = 2;
  optional ProjectHostSetupKind kind = 3;
  optional string path = 4;
  optional ProjectHostSetupMethod setup_method = 5;
  optional ProjectHostSetupState setup_state = 6;
  optional string worktree_base_path = 7;
}

message ProjectHostSetupServiceDeleteRequest {
  int64 expected_revision = 1;
  string setup_id = 2;
}

// Why: create answers without a repo row, the import and clone paths always
// attach one, and update and delete carry one only when the mutation touched
// it — one response message with optional repo models all four outcomes.
message ProjectHostSetupMutationResult {
  ProjectHostSetupProject project = 1;
  optional ProjectHostSetupRepo repo = 2;
  ProjectHostSetupRecord setup = 3;
}

message ProjectHostSetupServiceMutationResponse {
  ProjectHostSetupMutationResult result = 1;
  int64 revision = 2;
}

// Why: the legacy surface answers a stale revision with the
// workspaceRevisionConflict error code plus actual/expected/scope data, so the
// protobuf surface carries the same trio as a typed status detail (the pattern
// ShellRepoHostRevisionConflict established).
message ProjectHostSetupRevisionConflict {
  int64 expected_revision = 1;
  int64 actual_revision = 2;
  string scope = 3;
}
