syntax = "proto3";

package yiru.runtime.v1;

import "yiru/protocol/v1/annotations.proto";

service RitualService {
  rpc GetSchedule(RitualServiceGetScheduleRequest) returns (RitualServiceScheduleResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SetSchedule(RitualServiceSetScheduleRequest) returns (RitualServiceScheduleResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Run(RitualServiceRunRequest) returns (RitualServiceRunResponse) {
    option (yiru.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (yiru.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum RitualKind {
  RITUAL_KIND_UNSPECIFIED = 0;
  RITUAL_KIND_START_DAY = 1;
  RITUAL_KIND_END_DAY = 2;
}

message RitualSchedule {
  bool enabled = 1;
  bool archive_on_end_day = 2;
  // Why: minutes-of-day are bounded to a day by the authority, well inside
  // uint32, but the wire keeps the wider type so an out-of-range value is a
  // validation failure rather than a silent wraparound.
  uint32 start_minutes = 3;
  uint32 end_minutes = 4;
  string timezone = 5;
  // Why: weekday numbers are the legacy 0–6 (Sunday-based) schedule encoding,
  // and 1 through 7 entries are required by the authority.
  repeated uint32 weekdays = 6;
}

message RitualScheduleStatus {
  bool enabled = 1;
  bool archive_on_end_day = 2;
  uint32 start_minutes = 3;
  uint32 end_minutes = 4;
  string timezone = 5;
  repeated uint32 weekdays = 6;
  optional int64 last_start_at = 7;
  optional int64 last_end_at = 8;
  optional string last_failure = 9;
}

message RitualServiceGetScheduleRequest {}

message RitualServiceSetScheduleRequest {
  RitualSchedule schedule = 1;
}

message RitualServiceScheduleResponse {
  RitualScheduleStatus schedule = 1;
}

message RitualServiceRunRequest {
  RitualKind kind = 1;
}

// Why: project statuses come from the pluggable runner trait ("ready" and
// "failed" today), so the wire carries the string rather than an enum the
// trait contract does not guarantee.
message RitualProjectResult {
  string project_id = 1;
  string status = 2;
  string detail = 3;
}

message RitualServiceRunResponse {
  RitualKind kind = 1;
  string summary = 2;
  repeated RitualProjectResult projects = 3;
}
