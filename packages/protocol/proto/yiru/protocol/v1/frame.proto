syntax = "proto3";

package yiru.protocol.v1;

import "yiru/protocol/v1/errors.proto";

// Names every compatible Yiru protocol version from the shared schema.
enum ProtocolVersion {
  PROTOCOL_VERSION_UNSPECIFIED = 0;
  PROTOCOL_VERSION_V1 = 1;
  // V2 is admitted as `yiru-protobuf-v2` only when the current compatibility floor's complete
  // unconditional iOS surface is mounted: Status, Notifications, TerminalPreferences, Stats,
  // AgentStatus, and Accounts. Optional slices such as AiVault, Workspace revision, and Repo hooks
  // remain independently gated by their fine-grained runtime capabilities.
  PROTOCOL_VERSION_V2 = 2;
}

// Names optional transport behavior that must be negotiated before use.
enum TransportFeature {
  TRANSPORT_FEATURE_UNSPECIFIED = 0;
  TRANSPORT_FEATURE_ROUTED_CALLS = 1;
  TRANSPORT_FEATURE_REVERSE_CALLS = 2;
}

// Self-reported peer class validated during protocol admission.
enum PeerKind {
  PEER_KIND_UNSPECIFIED = 0;
  PEER_KIND_CHROME_EXTENSION = 1;
  PEER_KIND_IOS_APP = 2;
  PEER_KIND_CLI = 3;
  PEER_KIND_DAEMON = 4;
}

// Opens protocol negotiation after the underlying transport has authenticated the peer.
message Hello {
  // Values are ProtocolVersion numbers. uint32 preserves versions unknown to an older peer.
  repeated uint32 supported_protocol_versions = 1;
  PeerKind peer_kind = 2;
  string peer_name = 3;
  string peer_version = 4;
  string peer_instance_id = 5;
  uint32 max_frame_bytes = 6;
  uint64 initial_call_credit_bytes = 7;
  repeated TransportFeature supported_transport_features = 8;
}

// Selects the connection limits used until the transport closes.
message Welcome {
  uint32 protocol_version = 1;
  string daemon_version = 2;
  string runtime_id = 3;
  string session_id = 4;
  uint32 max_frame_bytes = 5;
  uint64 initial_call_credit_bytes = 6;
  uint32 keep_alive_interval_ms = 7;
  repeated TransportFeature enabled_transport_features = 8;
}

message RuntimeEnvironmentDestination {
  string environment_id = 1;
}

message CallDestination {
  oneof target {
    RuntimeEnvironmentDestination runtime_environment = 1;
  }
}

// Opens one multiplexed call. procedure is a full path such as
// /yiru.runtime.v1.StatusService/GetStatus. Clients allocate odd call IDs; even IDs are reserved.
message CallStart {
  uint64 call_id = 1;
  string procedure = 2;
  uint32 timeout_ms = 3;
  CallDestination destination = 6;

  reserved 4, 5;
  reserved "payload_format", "idempotency_key";
}

// Carries one serialized protobuf message and consumes data-byte credit.
message Payload {
  uint64 call_id = 1;
  bytes data = 2;
}

// Closes one sender direction. A non-OK status terminates the entire call.
message CallEnd {
  uint64 call_id = 1;
  Status status = 2;
}

// Cancels only the addressed call; peers must not tear down unrelated calls. The receiver answers
// an active call with CallEnd after every earlier frame for that call. A call whose terminal frame
// was already queued receives no second terminal frame.
message Cancel {
  uint64 call_id = 1;
  Status status = 2;
}

// Restores payload-byte credit to the sender for one call.
message WindowUpdate {
  uint64 call_id = 1;
  uint64 credit_bytes = 2;
}

message Ping {
  uint64 nonce = 1;
}

message Pong {
  uint64 nonce = 1;
}

// Rejects negotiation or terminates a connection that cannot continue.
message GoAway {
  Status status = 2;

  reserved 1, 3;
  reserved "last_accepted_call_id", "retry_after_ms";
}

// Multiplexes control frames and serialized protobuf messages over an ordered, reliable byte
// transport. Every encoded Frame is carried as ASCII "YIRU", followed by one ProtocolVersion byte,
// followed by the protobuf message. Advertised frame-byte limits include that five-byte preamble.
message Frame {
  uint32 protocol_version = 1;
  uint64 sequence = 2;

  oneof body {
    Hello hello = 10;
    Welcome welcome = 11;
    CallStart call_start = 12;
    Payload payload = 13;
    CallEnd call_end = 14;
    Cancel cancel = 15;
    WindowUpdate window_update = 16;
    Ping ping = 17;
    Pong pong = 18;
    GoAway go_away = 19;
  }

  reserved 3 to 9;
}
