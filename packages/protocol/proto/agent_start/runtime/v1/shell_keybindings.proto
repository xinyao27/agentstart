syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

// Why: every procedure reads or mutates the daemon host's own
// `.agentstart/keybindings.json`, so the whole service stays local — the legacy
// surface restricted these procedures to the local principal and the
// shell-platform and repo-host services already model that restriction the
// same way.
service ShellKeybindingsService {
  rpc Get(ShellKeybindingsServiceGetRequest) returns (ShellKeybindingsSnapshot) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc EnsureFile(ShellKeybindingsServiceEnsureFileRequest) returns (ShellKeybindingsSnapshot) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Reload(ShellKeybindingsServiceReloadRequest) returns (ShellKeybindingsSnapshot) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc OpenFile(ShellKeybindingsServiceOpenFileRequest) returns (ShellKeybindingsSnapshot) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RevealFile(ShellKeybindingsServiceRevealFileRequest) returns (ShellKeybindingsSnapshot) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SetAction(ShellKeybindingsServiceSetActionRequest) returns (ShellKeybindingsSnapshot) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum ShellKeybindingsPlatform {
  SHELL_KEYBINDINGS_PLATFORM_UNSPECIFIED = 0;
  SHELL_KEYBINDINGS_PLATFORM_DARWIN = 1;
  SHELL_KEYBINDINGS_PLATFORM_LINUX = 2;
  SHELL_KEYBINDINGS_PLATFORM_WIN32 = 3;
}

enum ShellKeybindingsSeverity {
  SHELL_KEYBINDINGS_SEVERITY_UNSPECIFIED = 0;
  SHELL_KEYBINDINGS_SEVERITY_WARNING = 1;
  SHELL_KEYBINDINGS_SEVERITY_ERROR = 2;
}

message ShellKeybindingsBindingList {
  repeated string bindings = 1;
}

// Why: the legacy surface serializes overrides as `{actionId: [bindings]}`
// objects with arbitrary action ids, so the typed shape is an entry list
// rather than a string-keyed map of repeated strings.
message ShellKeybindingsOverrideEntry {
  string action_id = 1;
  repeated string bindings = 2;
}

message ShellKeybindingsOverrideMap {
  repeated ShellKeybindingsOverrideEntry entries = 1;
}

message ShellKeybindingsPlatformOverrides {
  optional ShellKeybindingsOverrideMap darwin = 1;
  optional ShellKeybindingsOverrideMap linux = 2;
  optional ShellKeybindingsOverrideMap win32 = 3;
}

message ShellKeybindingsDiagnostic {
  ShellKeybindingsSeverity severity = 1;
  string message = 2;
  optional string action_id = 3;
  optional string section = 4;
}

message ShellKeybindingsSnapshot {
  string path = 1;
  ShellKeybindingsPlatform platform = 2;
  bool exists = 3;
  ShellKeybindingsOverrideMap overrides = 4;
  ShellKeybindingsOverrideMap common_overrides = 5;
  ShellKeybindingsPlatformOverrides platform_overrides = 6;
  repeated ShellKeybindingsDiagnostic diagnostics = 7;
}

message ShellKeybindingsServiceGetRequest {}

message ShellKeybindingsServiceEnsureFileRequest {}

message ShellKeybindingsServiceReloadRequest {}

message ShellKeybindingsServiceOpenFileRequest {}

message ShellKeybindingsServiceRevealFileRequest {}

// Why: the legacy surface treats `"bindings": null` as clearing the override
// and a missing field as invalid input, so the oneof keeps "send null" and
// "send a list" distinct instead of overloading field absence.
message ShellKeybindingsServiceSetActionRequest {
  string action_id = 1;
  oneof bindings {
    ShellKeybindingsBindingList set = 2;
    bool clear = 3;
  }
}
