// Why: presence of each field, not its value, decides whether `set` touches
// that piece of worktree metadata — mirroring the legacy JSON patch, where an
// absent key leaves the field untouched instead of clearing it. The two
// repeated fields are wrapped in a message so "untouched" (field absent) stays
// distinguishable from "cleared to empty" (field present with zero values),
// which a bare `repeated` field cannot express.
message WorktreeSetPatch {
  optional string display_name = 1;
  optional string sparse_base_ref = 2;
  optional string sparse_preset_id = 3;
  optional string base_ref = 4;
  optional string workspace_status = 5;
  optional string comment = 6;
  optional bool is_archived = 7;
  optional bool is_unread = 8;
  optional bool is_pinned = 9;
  optional bool pending_first_agent_message_rename = 10;
  optional double sort_order = 11;
  optional double manual_order = 12;
  optional double last_activity_at = 13;
  optional double created_at = 14;
  optional WorktreeNullableInt64 linked_pr = 15;
  optional WorktreeStringList sparse_directories = 16;
  optional WorktreeNullablePushTarget push_target = 17;
  optional WorktreeDiffCommentList diff_comments = 18;
  optional WorktreeMobileDiffReview mobile_diff_review = 19;
}

message WorktreeServiceSetRequest {
  string worktree = 1;
  int64 expected_revision = 2;
  WorktreeSetPatch patch = 3;
}

message WorktreeServiceSetResponse {
  WorktreeRecord worktree = 1;
  int64 revision = 2;
}

