      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
