}

enum RepoKind {
  REPO_KIND_UNSPECIFIED = 0;
  REPO_KIND_GIT = 1;
  REPO_KIND_FOLDER = 2;
}

enum RepoIconImageSource {
  REPO_ICON_IMAGE_SOURCE_UNSPECIFIED = 0;
  REPO_ICON_IMAGE_SOURCE_UPLOAD = 1;
  REPO_ICON_IMAGE_SOURCE_FILE = 2;
  REPO_ICON_IMAGE_SOURCE_FAVICON = 3;
  REPO_ICON_IMAGE_SOURCE_GITHUB = 4;
}

enum RepoHookSettingsMode {
  REPO_HOOK_SETTINGS_MODE_UNSPECIFIED = 0;
  REPO_HOOK_SETTINGS_MODE_AUTO = 1;
  REPO_HOOK_SETTINGS_MODE_OVERRIDE = 2;
}

enum RepoSetupAgentStartupPolicy {
  REPO_SETUP_AGENT_STARTUP_POLICY_UNSPECIFIED = 0;
  REPO_SETUP_AGENT_STARTUP_POLICY_START_IMMEDIATELY = 1;
  REPO_SETUP_AGENT_STARTUP_POLICY_WAIT_FOR_SETUP = 2;
}

enum RepoCommandSourcePolicy {
  REPO_COMMAND_SOURCE_POLICY_UNSPECIFIED = 0;
  REPO_COMMAND_SOURCE_POLICY_SHARED_ONLY = 1;
  REPO_COMMAND_SOURCE_POLICY_LOCAL_ONLY = 2;
  REPO_COMMAND_SOURCE_POLICY_RUN_BOTH = 3;
}

enum RepoForgeRemotePreference {
  REPO_FORGE_REMOTE_PREFERENCE_UNSPECIFIED = 0;
  REPO_FORGE_REMOTE_PREFERENCE_AUTO = 1;
  REPO_FORGE_REMOTE_PREFERENCE_UPSTREAM = 2;
  REPO_FORGE_REMOTE_PREFERENCE_ORIGIN = 3;
}

enum RepoForkSyncMode {
  REPO_FORK_SYNC_MODE_UNSPECIFIED = 0;
  REPO_FORK_SYNC_MODE_ASK = 1;
  REPO_FORK_SYNC_MODE_SAFE_AUTO = 2;
  REPO_FORK_SYNC_MODE_OFF = 3;
}

enum RepoExternalWorktreeVisibility {
  REPO_EXTERNAL_WORKTREE_VISIBILITY_UNSPECIFIED = 0;
  REPO_EXTERNAL_WORKTREE_VISIBILITY_HIDE = 1;
  REPO_EXTERNAL_WORKTREE_VISIBILITY_SHOW = 2;
}

enum RepoProjectHostSetupMethod {
  REPO_PROJECT_HOST_SETUP_METHOD_UNSPECIFIED = 0;
  REPO_PROJECT_HOST_SETUP_METHOD_IMPORTED_EXISTING_FOLDER = 1;
  REPO_PROJECT_HOST_SETUP_METHOD_CLONED = 2;
}

message RepoServiceListRequest {}

message RepoServiceListResponse {
  repeated Repo repos = 1;
  int64 revision = 2;
}

message RepoServiceAddRequest {
  int64 expected_revision = 1;
  string path = 2;
  RepoKind kind = 3;
  optional string host_id = 4;
}

message RepoServiceAddResponse {
  Repo repo = 1;
  int64 revision = 2;
}

message RepoRevisionConflict {
  int64 expected_revision = 1;
  int64 actual_revision = 2;
  string scope = 3;
}

message Repo {
  string id = 1;
  string path = 2;
  string display_name = 3;
  string badge_color = 4;
  optional RepoNullableIcon repo_icon = 5;
  optional RepoNullableUpstream upstream = 6;
  int64 added_at = 7;
  RepoKind kind = 8;
  optional string git_username = 9;
  optional string worktree_base_ref = 10;
  optional string worktree_base_path = 11;
  optional RepoHookSettings hook_settings = 12;
  optional RepoNullableString connection_id = 13;
  optional RepoNullableString execution_host_id = 14;
  RepoForgeRemotePreference forge_remote_preference = 15;
  RepoForkSyncMode fork_sync_mode = 16;
  optional RepoNullableGitRemoteIdentity git_remote_identity = 17;
  RepoExternalWorktreeVisibility external_worktree_visibility = 18;
  optional bool external_worktree_visibility_legacy = 19;
  optional double external_worktree_visibility_prompt_dismissed_at = 20;
  optional RepoStringList external_worktree_inbox_baseline_paths = 21;
  optional RepoStringList imported_external_worktree_paths = 22;
  optional double external_worktree_discovery_suppressed_at = 23;
  optional RepoStringList symlink_paths = 24;
  optional RepoNullableString project_group_id = 25;
  optional double project_group_order = 26;
  optional RepoSourceControlAiOverrides source_control_ai = 27;
  RepoProjectHostSetupMethod project_host_setup_method = 28;
}

message RepoNullableString {
  oneof value {
    string text = 1;
    bool null = 2;
  }
}

message RepoNullableBool {
  oneof value {
    bool boolean = 1;
    bool null = 2;
  }
}

message RepoNullableIcon {
  oneof value {
    RepoIcon icon = 1;
    bool null = 2;
  }
}

message RepoNullableUpstream {
  oneof value {
    RepoUpstream upstream = 1;
    bool null = 2;
  }
}

message RepoNullableGitRemoteIdentity {
  oneof value {
    RepoGitRemoteIdentity identity = 1;
    bool null = 2;
  }
}

message RepoIcon {
  oneof value {
    string lucide_name = 1;
    string emoji = 2;
    RepoImageIcon image = 3;
  }
}

message RepoImageIcon {
  string src = 1;
  RepoIconImageSource source = 2;
  optional string label = 3;
}

message RepoUpstream {
  string owner = 1;
  string repo = 2;
}

message RepoGitRemoteIdentity {
  string canonical_key = 1;
  string remote_name = 2;
  string remote_url = 3;
}

message RepoHookSettings {
  RepoHookSettingsMode mode = 1;
  RepoSetupRunPolicy setup_run_policy = 2;
  RepoSetupAgentStartupPolicy setup_agent_startup_policy = 3;
  RepoCommandSourcePolicy command_source_policy = 4;
  string setup_script = 5;
  string archive_script = 6;
}

message RepoStringMap {
  map<string, string> values = 1;
}

message RepoStringList {
  repeated string values = 1;
}

message RepoSourceControlModelChoice {
  optional RepoStringMap selected_model_by_agent = 1;
  optional RepoHostStringMap selected_model_by_agent_by_host = 2;
  optional RepoStringMap selected_thinking_by_model = 3;
}

message RepoHostStringMap {
  map<string, RepoStringMap> values = 1;
}

message RepoSourceControlActionOverride {
  optional RepoNullableString agent_id = 1;
  optional RepoNullableString command_input_template = 2;
  optional RepoNullableString agent_args = 3;
}

message RepoSourceControlPrCreationDefaults {
  optional RepoNullableBool draft = 1;
  optional RepoNullableBool use_template = 2;
  optional RepoNullableBool generate_details_on_open = 3;
  optional RepoNullableBool open_after_create = 4;
}

message RepoSourceControlAiOverrides {
  optional bool enabled = 1;
  optional string custom_agent_command = 2;
  optional RepoSourceControlModelChoiceMap model_overrides_by_operation = 3;
  optional RepoNullableStringMap instructions_by_operation = 4;
  optional RepoSourceControlActionOverrideMap action_overrides = 5;
  optional RepoSourceControlPrCreationDefaults pr_creation_defaults = 6;
}

message RepoSourceControlModelChoiceMap {
  map<string, RepoSourceControlModelChoice> values = 1;
}

message RepoNullableStringMap {
  map<string, RepoNullableString> values = 1;
}

message RepoSourceControlActionOverrideMap {
  map<string, RepoSourceControlActionOverride> values = 1;
}

enum RepoSetupRunPolicy {
  REPO_SETUP_RUN_POLICY_UNSPECIFIED = 0;
  REPO_SETUP_RUN_POLICY_ASK = 1;
  REPO_SETUP_RUN_POLICY_RUN_BY_DEFAULT = 2;
  REPO_SETUP_RUN_POLICY_SKIP_BY_DEFAULT = 3;
}

enum RepoHooksSource {
  REPO_HOOKS_SOURCE_UNSPECIFIED = 0;
  REPO_HOOKS_SOURCE_AGENT_START_YAML = 1;
  REPO_HOOKS_SOURCE_LEGACY = 2;
}

message RepoServiceGetHooksRequest {
  string project_id = 1;
}

message RepoSetupTrust {
  string content_hash = 1;
  string script_content = 2;
}

message RepoServiceGetHooksResponse {
  optional string setup_command = 1;
  RepoSetupRunPolicy setup_run_policy = 2;
  RepoHooksSource source = 3;
  optional RepoSetupTrust setup_trust = 4;
}

message RepoServiceCloneRequest {
  int64 expected_revision = 1;
  string url = 2;
  string destination = 3;
}

message RepoServiceCloneResponse {
  Repo repo = 1;
  int64 revision = 2;
}

message RepoServiceCreateRequest {
  int64 expected_revision = 1;
  string parent_path = 2;
  string name = 3;
  RepoKind kind = 4;
}

message RepoServiceCreateSuccess {
  Repo repo = 1;
  int64 revision = 2;
}

// Why: repo creation reports many recoverable validation and filesystem
// failures (name collisions, non-empty target directories, git init
// failures) as an in-band `{error}` result rather than an RPC error, matching
// the legacy JSON surface exactly so the client's inline-error UI keeps working
// unchanged.
message RepoServiceCreateResponse {
  oneof result {
    RepoServiceCreateSuccess success = 1;
    string error = 2;
  }
}

message RepoServiceGitAvailableRequest {}

message RepoServiceGitAvailableResponse {
  bool available = 1;
}

message RepoAgentStartHooksScripts {
  optional string setup = 1;
  optional string archive = 2;
}

message RepoAgentStartHooksDefaultTab {
  optional string title = 1;
  optional string color = 2;
  optional string command = 3;
}

message RepoAgentStartHooksWorktree {
  repeated string shared_directories = 1;
}

message RepoAgentStartHooks {
  RepoAgentStartHooksScripts scripts = 1;
  repeated RepoAgentStartHooksDefaultTab default_tabs = 2;
  optional RepoAgentStartHooksWorktree worktree = 3;
}

message RepoServiceHooksRequest {
  string repo = 1;
}

message RepoServiceHooksResponse {
  bool has_hooks_file = 1;
  optional RepoAgentStartHooks hooks = 2;
  RepoSetupRunPolicy setup_run_policy = 3;
  RepoHooksSource source = 4;
  optional RepoSetupTrust setup_trust = 5;
}

message RepoServiceHooksCheckRequest {
  string repo = 1;
  optional string host_id = 2;
}

enum RepoHooksCheckStatus {
  REPO_HOOKS_CHECK_STATUS_UNSPECIFIED = 0;
  REPO_HOOKS_CHECK_STATUS_OK = 1;
  REPO_HOOKS_CHECK_STATUS_ERROR = 2;
}

message RepoServiceHooksCheckResponse {
  RepoHooksCheckStatus status = 1;
  bool has_hooks = 2;
  optional RepoAgentStartHooks hooks = 3;
  bool may_need_update = 4;
}

message RepoSetupScriptImportCandidate {
  string provider = 1;
  string label = 2;
  repeated string files = 3;
  string setup = 4;
  optional string archive = 5;
  repeated string unsupported_fields = 6;
}

message RepoServiceSetupScriptImportsRequest {
  string repo = 1;
}

message RepoServiceSetupScriptImportsResponse {
  repeated RepoSetupScriptImportCandidate candidates = 1;
}

message RepoSparsePreset {
  string id = 1;
  string repo_id = 2;
  string name = 3;
  repeated string directories = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message RepoServiceSparsePresetsRequest {
  string repo = 1;
}

message RepoServiceSparsePresetsResponse {
  repeated RepoSparsePreset presets = 1;
}

message RepoServiceSaveSparsePresetRequest {
  string repo = 1;
  optional string id = 2;
  string name = 3;
  repeated string directories = 4;
}

message RepoServiceSaveSparsePresetResponse {
  RepoSparsePreset preset = 1;
}

message RepoServiceRemoveSparsePresetRequest {
  string repo = 1;
  string preset_id = 2;
}

message RepoServiceRemoveSparsePresetResponse {
  bool removed = 1;
}

message RepoServiceReorderRequest {
  int64 expected_revision = 1;
  repeated string ordered_ids = 2;
}

enum RepoReorderStatus {
  REPO_REORDER_STATUS_UNSPECIFIED = 0;
  REPO_REORDER_STATUS_APPLIED = 1;
  REPO_REORDER_STATUS_REJECTED = 2;
}

message RepoServiceReorderResponse {
  int64 revision = 1;
  RepoReorderStatus status = 2;
}

message RepoServiceRmRequest {
  int64 expected_revision = 1;
  string repo = 2;
}

message RepoServiceRmResponse {
  bool removed = 1;
  int64 revision = 2;
}

message RepoNullableDouble {
  oneof value {
    double number = 1;
    bool null = 2;
  }
}

// Why: every field is presence-tracked (proto3 `optional`, or a nullable
// wrapper message for a field the legacy surface can also clear) so absent,
// explicitly-cleared, and set-to-a-value stay distinguishable, matching
// `repo.update`'s partial-update semantics exactly instead of collapsing
// "not sent" into a zero value.
message RepoUpdateFields {
  optional string display_name = 1;
  optional string badge_color = 2;
  optional RepoNullableIcon repo_icon = 3;
  optional RepoNullableUpstream upstream = 4;
  optional RepoHookSettings hook_settings = 5;
  optional string worktree_base_ref = 6;
  optional string worktree_base_path = 7;
  optional RepoKind kind = 8;
  optional RepoStringList symlink_paths = 9;
  optional RepoForgeRemotePreference forge_remote_preference = 10;
  optional RepoForkSyncMode fork_sync_mode = 11;
  optional RepoExternalWorktreeVisibility external_worktree_visibility = 12;
  optional double external_worktree_visibility_prompt_dismissed_at = 13;
  optional RepoStringList external_worktree_inbox_baseline_paths = 14;
  optional RepoStringList imported_external_worktree_paths = 15;
  optional RepoNullableDouble external_worktree_discovery_suppressed_at = 16;
  optional RepoNullableString project_group_id = 17;
  optional double project_group_order = 18;
  optional RepoNullableSourceControlAi source_control_ai = 19;
}

message RepoNullableSourceControlAi {
  oneof value {
    RepoSourceControlAiOverrides overrides = 1;
    bool null = 2;
  }
}

message RepoServiceUpdateRequest {
  int64 expected_revision = 1;
  string repo = 2;
  RepoUpdateFields updates = 3;
}

message RepoServiceUpdateResponse {
  Repo repo = 1;
  int64 revision = 2;
}

message RepoServiceBaseRefDefaultRequest {
  string repo = 1;
  optional string host_id = 2;
}

message RepoServiceBaseRefDefaultResponse {
  optional string default_base_ref = 1;
  uint32 remote_count = 2;
}

message RepoServiceSearchRefsRequest {
  string repo = 1;
  string query = 2;
  optional double limit = 3;
  optional string host_id = 4;
}

message RepoRefDetail {
  string local_branch_name = 1;
  string ref_name = 2;
}

// Why: presence-tracked because a folder project returns no detail list at all
// while a Git project with no matching refs returns an empty one, and the
// legacy JSON surface distinguishes the two via `refDetails` being omitted.
message RepoRefDetailList {
  repeated RepoRefDetail values = 1;
}

message RepoServiceSearchRefsResponse {
  repeated string refs = 1;
  bool truncated = 2;
  optional RepoRefDetailList ref_details = 3;
}
