syntax = "proto3";
package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";
import "agent_start/runtime/v1/terminal.proto";
import "agent_start/runtime/v1/rate_limit_resume.proto";
import "agent_start/runtime/v1/worktree.proto";

// Why: registration selects an interactive shell separately from browser bulk connections.
service ShellHostService {
  rpc Register(ShellHostRegisterRequest) returns (ShellHostAccepted) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST tier: ACCESS_TIER_HOST callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
  // Why: this method is served by the authenticated browser's reverse handler only.
  rpc Execute(ShellHostRequest) returns (ShellHostResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST tier: ACCESS_TIER_HOST callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}
message ShellHostRegisterRequest {}
message ShellHostAccepted { bool accepted = 1; }
message ShellHostRequest {
  oneof command {
    ShellHostUiCommand ui = 1;
    ShellHostTerminalCreate terminal_create = 2;
    ShellHostTerminalReveal terminal_reveal = 3;
    ShellHostTerminalMount terminal_mount = 4;
    ShellHostTerminalClose terminal_close = 5;
    ShellHostMarkdownRead markdown_read = 6;
    ShellHostMarkdownSave markdown_save = 7;
    RateLimitResumeSchedule resume = 8;
    ShellHostNotificationDisplay notification_display = 9;
    ShellHostNotificationDismiss notification_dismiss = 10;
  }
}
message ShellHostResponse {
  oneof result {
    ShellHostAccepted accepted = 1;
    ShellHostTerminalCreated terminal_created = 2;
    ShellHostTerminalRevealed terminal_revealed = 3;
    ShellHostTerminalClosed terminal_closed = 4;
    ShellHostMarkdownContent markdown_content = 5;
    ShellHostMarkdownSaved markdown_saved = 6;
    ShellHostNotificationDisplayed notification_displayed = 7;
    ShellHostNotificationDismissed notification_dismissed = 8;
  }
}
message ShellHostTerminalCreate {
  optional string worktree_id = 1;
  optional string after_tab_id = 2;
  optional string target_group_id = 3;
  optional string command = 4;
  optional string cwd = 5;
  map<string,string> env = 6;
  repeated string env_to_delete = 7;
  TerminalLaunchConfig launch_config = 8;
  optional string launch_token = 9;
  optional string launch_agent = 10;
  optional string startup_command_delivery = 11;
  optional string title = 12;
  optional bool activate = 13;
  optional string presentation = 14;
  optional string source = 15;
}
message ShellHostTerminalReveal {
  string worktree_id = 1;
  string pty_id = 2;
  optional string durable_pty_id = 3;
  optional string title = 4;
  optional string cwd = 5;
  TerminalLaunchConfig launch_config = 6;
  optional string launch_token = 7;
  optional string launch_agent = 8;
  optional bool activate = 9;
  optional string presentation = 10;
  optional string tab_id = 11;
  optional string leaf_id = 12;
  optional string split_from_leaf_id = 13;
  optional string split_direction = 14;
  optional string split_telemetry_source = 15;
  optional string source = 16;
}
message ShellHostTerminalMount { string worktree_id = 1; optional string tab_id = 2; optional string pty_id = 3; }
message ShellHostTerminalClose { string tab_id = 1; }
message ShellHostTerminalCreated { string tab_id = 1; string title = 2; }
message ShellHostTerminalRevealed { string tab_id = 1; optional string title = 2; }
message ShellHostTerminalClosed { bool closed = 1; }
message ShellHostMarkdownRead { string worktree_id = 1; string tab_id = 2; }
message ShellHostMarkdownSave { string worktree_id = 1; string tab_id = 2; string base_version = 3; string content = 4; }
message ShellHostMarkdownContent {
  string tab_id = 1; string file_path = 2; string relative_path = 3; string content = 4;
  bool is_dirty = 5; string version = 6; string source = 7; bool editable = 8;
  optional string read_only_reason = 9;
}
message ShellHostMarkdownSaved { string tab_id = 1; string version = 2; bool is_dirty = 3; string content = 4; }
message ShellHostNotificationDisplay {
  optional string source = 1; optional string notification_id = 2; optional string worktree_id = 3;
  optional string pane_key = 4; string title = 5; string body = 6; bool use_system_sound = 7;
  bool suppress_when_focused = 8; optional bool require_display_confirmation = 9;
}
message ShellHostNotificationDismiss { repeated string notification_ids = 1; }
message ShellHostNotificationDisplayed { bool delivered = 1; optional string reason = 2; }
message ShellHostNotificationDismissed { uint32 dismissed = 1; }
message ShellHostUiCommand {
  oneof command {
    ShellHostActivateWorktree activate_worktree = 1;
    ShellHostSplitTerminal split_terminal = 2;
    ShellHostRenameTerminal rename_terminal = 3;
    ShellHostFocusTerminal focus_terminal = 4;
    ShellHostTabTarget focus_editor_tab = 5;
    ShellHostTabTarget close_session_tab = 6;
    ShellHostMoveSessionTab move_session_tab = 7;
    ShellHostOpenFile open_file = 8;
    ShellHostOpenDiff open_diff = 9;
    ShellHostCloseTerminal close_terminal = 10;
    ShellHostWorktreeTarget sleep_worktree = 11;
    ShellHostWorktreeTarget resume_sleeping_agents = 12;
  }
}
message ShellHostActivateWorktree {
  string repo_id = 1; string worktree_id = 2; WorktreeSetupLaunch setup = 3;
  ShellHostStartupLaunch startup = 4; WorktreeDefaultTabs default_tabs = 5;
}
message ShellHostStartupLaunch {
  string command = 1; map<string,string> env = 2; TerminalLaunchConfig launch_config = 3;
  optional string launch_token = 4; optional string launch_agent = 5;
  optional string startup_command_delivery = 6; ShellHostLaunchTelemetry telemetry = 7;
}
message ShellHostLaunchTelemetry { string agent_kind = 1; string launch_source = 2; string request_kind = 3; }
message ShellHostSplitTerminal {
  string tab_id = 1; sint32 pane_runtime_id = 2; string direction = 3;
  optional string command = 4; optional string telemetry_source = 5;
}
message ShellHostRenameTerminal { string tab_id = 1; optional string title = 2; }
message ShellHostFocusTerminal {
  string tab_id = 1; string worktree_id = 2; optional string leaf_id = 3;
  optional string ack_pane_key_on_success = 4; optional bool flash_focused_pane = 5;
  optional bool scroll_to_bottom_if_output_since_last_view = 6;
}
message ShellHostTabTarget { string tab_id = 1; string worktree_id = 2; }
message ShellHostMoveSessionTab {
  string tab_id = 1; string worktree_id = 2; string target_group_id = 3;
  oneof move {
    ShellHostTabReorder reorder = 4;
    ShellHostTabMoveToGroup move_to_group = 5;
    ShellHostTabSplit split = 6;
  }
}
message ShellHostTabReorder { repeated string tab_order = 1; }
message ShellHostTabMoveToGroup { optional uint32 index = 1; }
message ShellHostTabSplit { string direction = 1; }
message ShellHostOpenFile { string worktree_id = 1; string file_path = 2; string relative_path = 3; optional string runtime_environment_id = 4; }
message ShellHostOpenDiff { string worktree_id = 1; string file_path = 2; string relative_path = 3; bool staged = 4; optional string runtime_environment_id = 5; }
message ShellHostCloseTerminal { string tab_id = 1; optional sint32 pane_runtime_id = 2; }
message ShellHostWorktreeTarget { string worktree_id = 1; }
