syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service LayoutService {
  rpc List(LayoutServiceListRequest) returns (LayoutServiceListResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Apply(LayoutServiceApplyRequest) returns (LayoutServiceApplyResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message LayoutServiceListRequest {
  string worktree = 1;
}

message LayoutServiceListResponse {
  repeated LayoutRecipe recipes = 1;
}

message LayoutServiceApplyRequest {
  string worktree = 1;
  int64 expected_revision = 2;
  string name = 3;
}

message LayoutServiceApplyResponse {
  repeated LayoutAppliedPane panes = 1;
  int64 revision = 2;
}

message LayoutRecipe {
  string name = 1;
  repeated LayoutPane panes = 2;
}

message LayoutPane {
  string title = 1;
  oneof kind {
    LayoutCommandPane command = 2;
    LayoutAgentPane agent = 3;
    LayoutShellPane shell = 4;
  }
}

message LayoutCommandPane {
  string command = 1;
}

message LayoutAgentPane {
  string agent = 1;
  optional string prompt = 2;
}

message LayoutShellPane {
}

message LayoutAppliedPane {
  string terminal_handle = 1;
  string title = 2;
  optional string session_id = 3;
}

message LayoutRevisionConflict {
  int64 expected_revision = 1;
  int64 actual_revision = 2;
  string scope = 3;
}
