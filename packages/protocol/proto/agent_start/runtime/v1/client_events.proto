syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service ClientEventsService {
  rpc Subscribe(ClientEventsServiceSubscribeRequest) returns (stream ClientEventsServiceEvent) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_RESTART_FROM_REQUEST
    };
  }

  rpc Unsubscribe(ClientEventsServiceUnsubscribeRequest) returns (ClientEventsServiceUnsubscribeResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message ClientEventsServiceSubscribeRequest {}

message ClientEventsServiceUnsubscribeRequest {
  string subscription_id = 1;
}

message ClientEventsServiceUnsubscribeResponse {
  bool unsubscribed = 1;
}

message ClientEventsSubscribeReady {
  string subscription_id = 1;
}

message ClientEventsWorktreeRename {
  string old_worktree_id = 1;
  string new_worktree_id = 2;
}

message ClientEventsWorktreesChanged {
  string repo_id = 1;
  optional ClientEventsWorktreeRename renamed = 2;
}

message ClientEventsWorktreeHeadIdentity {
  string worktree_path = 1;
  string head = 2;
  optional string branch = 3;
}

message ClientEventsWorktreeHeadIdentitiesChanged {
  string repo_id = 1;
  repeated ClientEventsWorktreeHeadIdentity identities = 2;
}

message ClientEventsActivateWorktree {
  string repo_id = 1;
  string worktree_id = 2;
  // Why: the setup/startup/default-tabs payloads are the worktree's own open
  // documents, so they stay typed recursive JSON values.
  optional ClientEventsJsonValue setup = 3;
  optional ClientEventsJsonValue startup = 4;
  optional ClientEventsJsonValue default_tabs = 5;
}

message ClientEventsServiceEvent {
  oneof event {
    ClientEventsSubscribeReady ready = 1;
    bool repos_changed = 2;
    ClientEventsWorktreesChanged worktrees_changed = 3;
    ClientEventsActivateWorktree activate_worktree = 4;
    ClientEventsWorktreeHeadIdentitiesChanged worktree_head_identities_changed = 5;
    bool end = 6;
  }
}

// Why: the same open-ended shape rule as SettingsJsonValue — a typed recursive
// JSON value instead of google.protobuf.Struct or a JSON string.
message ClientEventsJsonValue {
  oneof kind {
    ClientEventsJsonNull null_value = 1;
    bool bool_value = 2;
    double number_value = 3;
    string string_value = 4;
    ClientEventsJsonValueList list_value = 5;
    ClientEventsJsonValueObject object_value = 6;
  }
}

enum ClientEventsJsonNull {
  CLIENT_EVENTS_JSON_NULL_UNSPECIFIED = 0;
  CLIENT_EVENTS_JSON_NULL_VALUE = 1;
}

message ClientEventsJsonValueList {
  repeated ClientEventsJsonValue values = 1;
}

message ClientEventsJsonValueObject {
  repeated ClientEventsJsonValueEntry entries = 1;
}

message ClientEventsJsonValueEntry {
  string key = 1;
  ClientEventsJsonValue value = 2;
}
