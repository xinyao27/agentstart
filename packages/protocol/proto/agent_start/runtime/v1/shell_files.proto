syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

// Why: `shell.files.*` is the shell's own OS-host file surface (downloads,
// external-path imports, the daemon's own filesystem) as opposed to
// `FilesService`, which is worktree/host-selected filesystem access. Every
// leaf always addresses the OS host running the current Chrome client, never
// the selected runtime environment, so every method is local-route-only.
service ShellFilesService {
  rpc AuthorizeExternalPath(ShellFilesServiceAuthorizeExternalPathRequest) returns (ShellFilesServiceAuthorizeExternalPathResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Copy(ShellFilesServiceCopyRequest) returns (ShellFilesServiceCopyResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CreateDirectory(ShellFilesServiceCreateDirectoryRequest) returns (ShellFilesServiceCreateDirectoryResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CreateFile(ShellFilesServiceCreateFileRequest) returns (ShellFilesServiceCreateFileResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Delete(ShellFilesServiceDeleteRequest) returns (ShellFilesServiceDeleteResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc PathExists(ShellFilesServicePathExistsRequest) returns (ShellFilesServicePathExistsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Read(ShellFilesServiceReadRequest) returns (ShellFilesServiceReadResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ReadChunk(ShellFilesServiceReadChunkRequest) returns (ShellFilesServiceReadChunkResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Rename(ShellFilesServiceRenameRequest) returns (ShellFilesServiceRenameResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ResolveDroppedPathsForAgent(ShellFilesServiceResolveDroppedPathsForAgentRequest) returns (ShellFilesServiceResolveDroppedPathsForAgentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc StageExternalPathsForRuntimeUpload(ShellFilesServiceStageExternalPathsForRuntimeUploadRequest) returns (ShellFilesServiceStageExternalPathsForRuntimeUploadResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Stat(ShellFilesServiceStatRequest) returns (ShellFilesServiceStatResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Write(ShellFilesServiceWriteRequest) returns (ShellFilesServiceWriteResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message ShellFilesMutationResult {
  bool ok = 1;
}

enum ShellFilesImportSkipReason {
  SHELL_FILES_IMPORT_SKIP_REASON_UNSPECIFIED = 0;
  SHELL_FILES_IMPORT_SKIP_REASON_MISSING = 1;
  SHELL_FILES_IMPORT_SKIP_REASON_PERMISSION_DENIED = 2;
  SHELL_FILES_IMPORT_SKIP_REASON_SYMLINK = 3;
  SHELL_FILES_IMPORT_SKIP_REASON_UNSUPPORTED = 4;
}

enum ShellFilesStagedSourceKind {
  SHELL_FILES_STAGED_SOURCE_KIND_UNSPECIFIED = 0;
  SHELL_FILES_STAGED_SOURCE_KIND_DIRECTORY = 1;
  SHELL_FILES_STAGED_SOURCE_KIND_FILE = 2;
}

message ShellFilesStagedDirectoryEntry {
  string relative_path = 1;
}

message ShellFilesStagedFileEntry {
  string relative_path = 1;
  bytes content = 2;
}

message ShellFilesStagedImportEntry {
  oneof kind {
    ShellFilesStagedDirectoryEntry directory = 1;
    ShellFilesStagedFileEntry file = 2;
  }
}

message ShellFilesStagedOutcome {
  string name = 1;
  ShellFilesStagedSourceKind kind = 2;
  repeated ShellFilesStagedImportEntry entries = 3;
}

message ShellFilesSkippedOutcome {
  ShellFilesImportSkipReason reason = 1;
}

message ShellFilesFailedOutcome {
  string reason = 1;
}

message ShellFilesStagedSource {
  string source_path = 1;
  oneof outcome {
    ShellFilesStagedOutcome staged = 2;
    ShellFilesSkippedOutcome skipped = 3;
    ShellFilesFailedOutcome failed = 4;
  }
}

message ShellFilesDroppedPathSkip {
  string source_path = 1;
  string reason = 2;
}

message ShellFilesDroppedPathFailure {
  string source_path = 1;
  string reason = 2;
}

message ShellFilesServiceAuthorizeExternalPathRequest {
  string target_path = 1;
}

message ShellFilesServiceAuthorizeExternalPathResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServiceCopyRequest {
  string source_path = 1;
  string destination_path = 2;
}

message ShellFilesServiceCopyResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServiceCreateDirectoryRequest {
  string directory_path = 1;
}

message ShellFilesServiceCreateDirectoryResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServiceCreateFileRequest {
  string file_path = 1;
}

message ShellFilesServiceCreateFileResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServiceDeleteRequest {
  string target_path = 1;
  bool recursive = 2;
}

message ShellFilesServiceDeleteResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServicePathExistsRequest {
  string file_path = 1;
}

message ShellFilesServicePathExistsResponse {
  bool exists = 1;
}

message ShellFilesServiceReadRequest {
  string file_path = 1;
  bool include_local_log_metadata = 2;
}

message ShellFilesServiceReadResponse {
  // Why: one wire payload covers all three legacy shapes (utf8 text, an
  // image/PDF preview, or an unpreviewable binary) instead of the JSON
  // surface's base64-everything encoding; `is_binary`/`is_image`/`mime_type`
  // disambiguate which one `content` holds.
  bytes content = 1;
  bool is_binary = 2;
  optional bool is_image = 3;
  optional string mime_type = 4;
  optional string file_identity = 5;
}

message ShellFilesServiceReadChunkRequest {
  string file_path = 1;
  uint64 offset = 2;
  uint32 length = 3;
}

message ShellFilesServiceReadChunkResponse {
  bytes content = 1;
  uint32 bytes_read = 2;
  bool eof = 3;
}

message ShellFilesServiceRenameRequest {
  string old_path = 1;
  string new_path = 2;
}

message ShellFilesServiceRenameResponse {
  ShellFilesMutationResult result = 1;
}

message ShellFilesServiceResolveDroppedPathsForAgentRequest {
  repeated string paths = 1;
  string worktree_path = 2;
}

message ShellFilesServiceResolveDroppedPathsForAgentResponse {
  repeated string resolved_paths = 1;
  repeated ShellFilesDroppedPathSkip skipped = 2;
  repeated ShellFilesDroppedPathFailure failed = 3;
}

message ShellFilesServiceStageExternalPathsForRuntimeUploadRequest {
  repeated string source_paths = 1;
}

message ShellFilesServiceStageExternalPathsForRuntimeUploadResponse {
  repeated ShellFilesStagedSource sources = 1;
}

message ShellFilesServiceStatRequest {
  string file_path = 1;
}

message ShellFilesServiceStatResponse {
  bool is_directory = 1;
  double mtime = 2;
  uint64 size = 3;
}

message ShellFilesServiceWriteRequest {
  string file_path = 1;
  string content = 2;
}

message ShellFilesServiceWriteResponse {
  ShellFilesMutationResult result = 1;
}
