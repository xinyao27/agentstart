syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service MobilePairingService {
  rpc CreateDevelopmentOffer(MobilePairingServiceCreateDevelopmentOfferRequest) returns (MobilePairingServiceCreateDevelopmentOfferResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CLI
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ListNetworkInterfaces(MobilePairingServiceListNetworkInterfacesRequest) returns (MobilePairingServiceListNetworkInterfacesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc GetPairingQr(MobilePairingServiceGetPairingQrRequest) returns (MobilePairingServiceGetPairingQrResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ListDevices(MobilePairingServiceListDevicesRequest) returns (MobilePairingServiceListDevicesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RevokeDevice(MobilePairingServiceRevokeDeviceRequest) returns (MobilePairingServiceRevokeDeviceResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message MobilePairingServiceCreateDevelopmentOfferRequest {
  string address = 1;
  string device_name = 2;
}

message MobilePairingServiceCreateDevelopmentOfferResponse {
  string device_id = 1;
  string endpoint = 2;
  string pairing_url = 3;
}

message MobilePairingServiceListNetworkInterfacesRequest {}

message MobilePairingServiceListNetworkInterfacesResponse {
  repeated MobileNetworkInterface interfaces = 1;
}

message MobileNetworkInterface {
  string name = 1;
  string address = 2;
}

message MobilePairingServiceGetPairingQrRequest {
  optional string address = 1;
  bool rotate = 2;
}

message MobilePairingServiceGetPairingQrResponse {
  bool available = 1;
  optional string device_id = 2;
  optional string endpoint = 3;
  optional string pairing_url = 4;
  optional string qr_data_url = 5;
}

message MobilePairingServiceListDevicesRequest {}

message MobilePairingServiceListDevicesResponse {
  repeated MobilePairedDevice devices = 1;
}

message MobilePairedDevice {
  string device_id = 1;
  string name = 2;
  int64 paired_at_unix_ms = 3;
  int64 last_seen_at_unix_ms = 4;
}

message MobilePairingServiceRevokeDeviceRequest {
  string device_id = 1;
}

message MobilePairingServiceRevokeDeviceResponse {
  bool revoked = 1;
}
