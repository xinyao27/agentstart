syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service ProviderUsageService {
  rpc GetScanState(ProviderUsageGetScanStateRequest) returns (ProviderUsageGetScanStateResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SetEnabled(ProviderUsageSetEnabledRequest) returns (ProviderUsageSetEnabledResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Refresh(ProviderUsageRefreshRequest) returns (ProviderUsageRefreshResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc GetSnapshot(ProviderUsageGetSnapshotRequest) returns (ProviderUsageGetSnapshotResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum ProviderUsageProvider {
  PROVIDER_USAGE_PROVIDER_UNSPECIFIED = 0;
  PROVIDER_USAGE_PROVIDER_CLAUDE = 1;
  PROVIDER_USAGE_PROVIDER_CODEX = 2;
  PROVIDER_USAGE_PROVIDER_OPEN_CODE = 3;
}

enum ProviderUsageScope {
  PROVIDER_USAGE_SCOPE_UNSPECIFIED = 0;
  PROVIDER_USAGE_SCOPE_AGENT_START = 1;
  PROVIDER_USAGE_SCOPE_ALL = 2;
}

enum ProviderUsageRange {
  PROVIDER_USAGE_RANGE_UNSPECIFIED = 0;
  PROVIDER_USAGE_RANGE_SEVEN_DAYS = 1;
  PROVIDER_USAGE_RANGE_THIRTY_DAYS = 2;
  PROVIDER_USAGE_RANGE_NINETY_DAYS = 3;
  PROVIDER_USAGE_RANGE_ALL = 4;
}

message ProviderUsageScanState {
  bool enabled = 1;
  bool is_scanning = 2;
  optional int64 last_scan_started_at = 3;
  optional int64 last_scan_completed_at = 4;
  optional string last_scan_error = 5;
  bool has_any_claude_data = 6;
  bool has_any_codex_data = 7;
  bool has_any_open_code_data = 8;
}

message ProviderUsageGetScanStateRequest {
  ProviderUsageProvider provider = 1;
}

message ProviderUsageGetScanStateResponse {
  ProviderUsageScanState scan_state = 1;
}

message ProviderUsageSetEnabledRequest {
  ProviderUsageProvider provider = 1;
  bool enabled = 2;
}

message ProviderUsageSetEnabledResponse {
  ProviderUsageScanState scan_state = 1;
}

message ProviderUsageRefreshRequest {
  ProviderUsageProvider provider = 1;
  bool force = 2;
}

message ProviderUsageRefreshResponse {
  ProviderUsageScanState scan_state = 1;
}

message ProviderUsageGetSnapshotRequest {
  ProviderUsageProvider provider = 1;
  ProviderUsageScope scope = 2;
  ProviderUsageRange range = 3;
  optional uint64 limit = 4;
}

message ProviderUsageGetSnapshotResponse {
  ProviderUsageScanState scan_state = 1;
  ProviderUsageSummary summary = 2;
  repeated ProviderUsageDailyData daily = 3;
  repeated ProviderUsageBreakdown model_breakdown = 4;
  repeated ProviderUsageBreakdown project_breakdown = 5;
  repeated ProviderUsageSession recent_sessions = 6;
}

message ProviderUsageSummary {
  string scope = 1;
  string range = 2;
  uint64 sessions = 3;
  uint64 turns = 4;
  uint64 zero_cache_read_turns = 5;
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
  uint64 cached_input_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  uint64 reasoning_output_tokens = 11;
  uint64 total_tokens = 12;
  uint64 events = 13;
  optional double cache_reuse_rate = 14;
  optional double estimated_cost_usd = 15;
  optional string top_model = 16;
  optional string top_project = 17;
  bool has_any_claude_data = 18;
  bool has_any_codex_data = 19;
  bool has_any_open_code_data = 20;
}

message ProviderUsageDailyData {
  string day = 1;
  uint64 input_tokens = 2;
  uint64 output_tokens = 3;
  uint64 cached_input_tokens = 4;
  uint64 cache_read_tokens = 5;
  uint64 cache_write_tokens = 6;
  uint64 reasoning_output_tokens = 7;
  uint64 total_tokens = 8;
  uint64 unpriced_tokens = 9;
  optional double estimated_cost_usd = 10;
}

message ProviderUsageBreakdown {
  string key = 1;
  string label = 2;
  uint64 sessions = 3;
  uint64 turns = 4;
  uint64 events = 5;
  uint64 input_tokens = 6;
  uint64 output_tokens = 7;
  uint64 cached_input_tokens = 8;
  uint64 cache_read_tokens = 9;
  uint64 cache_write_tokens = 10;
  uint64 reasoning_output_tokens = 11;
  uint64 total_tokens = 12;
  optional double estimated_cost_usd = 13;
  bool has_inferred_pricing = 14;
}

message ProviderUsageSession {
  string session_id = 1;
  string last_active_at = 2;
  uint64 duration_minutes = 3;
  string project_label = 4;
  uint64 turns = 5;
  uint64 events = 6;
  uint64 input_tokens = 7;
  uint64 cached_input_tokens = 8;
  uint64 output_tokens = 9;
  uint64 reasoning_output_tokens = 10;
  uint64 total_tokens = 11;
  uint64 cache_read_tokens = 12;
  uint64 cache_write_tokens = 13;
  optional string branch = 14;
  optional string model = 15;
  bool has_inferred_pricing = 16;
}
