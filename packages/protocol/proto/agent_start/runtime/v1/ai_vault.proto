syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service AiVaultService {
  rpc ListSessions(AiVaultServiceListSessionsRequest) returns (AiVaultServiceListSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ListSubagentSessions(AiVaultServiceListSubagentSessionsRequest) returns (AiVaultServiceListSubagentSessionsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message AiVaultServiceListSessionsRequest {
  optional uint32 limit = 1;
  bool force = 2;
  bool compact = 3;
  repeated string scope_paths = 4;
  optional string execution_host_scope = 5;
  optional string execution_host_id = 6;
}

message AiVaultServiceListSubagentSessionsRequest {
  optional string agent = 1;
  optional string parent_file_path = 2;
  optional string execution_host_id = 3;
}

message AiVaultServiceListSubagentSessionsResponse {
  repeated AiVaultSession sessions = 1;
  repeated AiVaultScanIssue issues = 2;
}

message AiVaultServiceListSessionsResponse {
  repeated AiVaultSession sessions = 1;
  repeated AiVaultScanIssue issues = 2;
  string scanned_at = 3;
}

enum AiVaultHostPlatform {
  AI_VAULT_HOST_PLATFORM_UNSPECIFIED = 0;
  AI_VAULT_HOST_PLATFORM_DARWIN = 1;
  AI_VAULT_HOST_PLATFORM_LINUX = 2;
  AI_VAULT_HOST_PLATFORM_WINDOWS = 3;
  AI_VAULT_HOST_PLATFORM_UNKNOWN = 4;
}

enum AiVaultPreviewRole {
  AI_VAULT_PREVIEW_ROLE_UNSPECIFIED = 0;
  AI_VAULT_PREVIEW_ROLE_USER = 1;
  AI_VAULT_PREVIEW_ROLE_ASSISTANT = 2;
  AI_VAULT_PREVIEW_ROLE_SYSTEM = 3;
  AI_VAULT_PREVIEW_ROLE_TOOL = 4;
  AI_VAULT_PREVIEW_ROLE_UNKNOWN = 5;
}

enum AiVaultSubagentStatus {
  AI_VAULT_SUBAGENT_STATUS_UNSPECIFIED = 0;
  AI_VAULT_SUBAGENT_STATUS_RUNNING = 1;
  AI_VAULT_SUBAGENT_STATUS_COMPLETED = 2;
  AI_VAULT_SUBAGENT_STATUS_FAILED = 3;
  AI_VAULT_SUBAGENT_STATUS_STOPPED = 4;
}

message AiVaultSession {
  string id = 1;
  string execution_host_id = 2;
  optional AiVaultHostPlatform execution_host_platform = 3;
  string agent = 4;
  string session_id = 5;
  string title = 6;
  optional string cwd = 7;
  optional string branch = 8;
  optional string model = 9;
  string file_path = 10;
  optional string codex_home = 11;
  optional string created_at = 12;
  optional string updated_at = 13;
  string modified_at = 14;
  uint64 message_count = 15;
  uint64 total_tokens = 16;
  optional AiVaultDayTokensList tokens_by_day = 17;
  optional AiVaultTokenUsageList token_usage = 18;
  repeated AiVaultPreviewMessage preview_messages = 19;
  optional string last_user_prompt = 20;
  uint64 queued_message_count = 21;
  uint64 subagent_transcript_count = 22;
  string resume_command = 23;
  optional AiVaultSubagentInfo subagent = 24;
}

message AiVaultDayTokensList {
  repeated AiVaultDayTokens values = 1;
}

message AiVaultDayTokens {
  string day = 1;
  uint64 tokens = 2;
}

message AiVaultTokenUsageList {
  repeated AiVaultTokenUsage values = 1;
}

message AiVaultTokenUsage {
  optional string provider = 1;
  optional string model = 2;
  optional string timestamp = 3;
  uint64 input_tokens = 4;
  uint64 output_tokens = 5;
  uint64 cache_read_tokens = 6;
  uint64 cache_write_tokens = 7;
  uint64 reasoning_output_tokens = 8;
  uint64 total_tokens = 9;
}

message AiVaultPreviewMessage {
  AiVaultPreviewRole role = 1;
  string text = 2;
  optional string timestamp = 3;
}

message AiVaultSubagentInfo {
  string parent_session_id = 1;
  optional string agent_type = 2;
  optional AiVaultSubagentStatus status = 3;
}

message AiVaultScanIssue {
  optional string execution_host_id = 1;
  string agent = 2;
  string path = 3;
  string message = 4;
}
