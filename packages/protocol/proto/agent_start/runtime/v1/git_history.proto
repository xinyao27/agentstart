syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";
import "agent_start/runtime/v1/git_common.proto";

// Read-only commit history and ref-to-ref / commit-to-parent comparison. See
// apps/daemon/src/rpc/git.rs's METHODS table (git.history, git.branchCompare,
// git.branchDiff, git.commitCompare, git.commitDiff).
service GitHistoryService {
  rpc History(GitHistoryServiceHistoryRequest) returns (GitHistoryServiceHistoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc BranchCompare(GitHistoryServiceBranchCompareRequest) returns (GitHistoryServiceBranchCompareResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc BranchDiff(GitHistoryServiceBranchDiffRequest) returns (GitHistoryServiceBranchDiffResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CommitCompare(GitHistoryServiceCommitCompareRequest) returns (GitHistoryServiceCommitCompareResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CommitDiff(GitHistoryServiceCommitDiffRequest) returns (GitHistoryServiceCommitDiffResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum GitHistoryRefScope {
  GIT_HISTORY_REF_SCOPE_UNSPECIFIED = 0;
  GIT_HISTORY_REF_SCOPE_HEAD = 1;
  GIT_HISTORY_REF_SCOPE_ALL = 2;
}

message GitRefEntry {
  string id = 1;
  string name = 2;
  string revision = 3;
  GitRefCategory category = 4;
  optional string remote_name = 5;
  optional bool is_checked_out = 6;
}

message GitCommitHistoryItem {
  string id = 1;
  repeated string parent_ids = 2;
  string subject = 3;
  string message = 4;
  string display_id = 5;
  optional string author = 6;
  optional string author_email = 7;
  optional int64 timestamp_ms = 8;
  repeated GitRefEntry references = 9;
}

message GitHistoryServiceHistoryRequest {
  string worktree = 1;
  // Absent (0) leaves history.rs's own default (50, clamped 1..200) in force.
  optional uint32 limit = 2;
  optional uint32 skip = 3;
  optional string base_ref = 4;
  // GIT_HISTORY_REF_SCOPE_UNSPECIFIED leaves the legacy "head" default in force.
  GitHistoryRefScope ref_scope = 5;
  optional bool include_remote_branches = 6;
}

message GitHistoryServiceHistoryResponse {
  repeated GitCommitHistoryItem items = 1;
  optional GitRefEntry current_ref = 2;
  optional GitRefEntry remote_ref = 3;
  optional GitRefEntry base_ref = 4;
  optional string merge_base = 5;
  bool has_incoming_changes = 6;
  bool has_outgoing_changes = 7;
  bool has_more = 8;
  uint32 limit = 9;
}

enum GitCompareStatus {
  GIT_COMPARE_STATUS_UNSPECIFIED = 0;
  GIT_COMPARE_STATUS_READY = 1;
  GIT_COMPARE_STATUS_ERROR = 2;
  GIT_COMPARE_STATUS_UNBORN_HEAD = 3;
  GIT_COMPARE_STATUS_INVALID_BASE = 4;
  GIT_COMPARE_STATUS_NO_MERGE_BASE = 5;
  GIT_COMPARE_STATUS_INVALID_COMMIT = 6;
}

// Shared by BranchCompare and CommitCompare, whose legacy JSON summaries use
// disjoint field sets (branch_compare: base_ref/base_oid/head_oid/merge_base;
// commit_compare: commit_oid/parent_oid). Every field below is populated by
// exactly one of the two operations; a client narrows on which RPC it called.
message GitCompareSummary {
  string base_ref = 1;
  optional string base_oid = 2;
  string compare_ref = 3;
  optional string head_oid = 4;
  optional string merge_base = 5;
  uint64 changed_files = 6;
  GitCompareStatus status = 7;
  optional string error_message = 8;
  optional uint64 commits_ahead = 9;
  optional string commit_oid = 10;
  optional string parent_oid = 11;
}

message GitCompareResult {
  GitCompareSummary summary = 1;
  repeated GitChangeEntry entries = 2;
}

message GitHistoryServiceBranchCompareRequest {
  string worktree = 1;
  string base_ref = 2;
}

message GitHistoryServiceBranchCompareResponse {
  GitCompareResult compare = 1;
  // Why: git.rs truncates branchCompare's entries to 20,000 for mobile callers
  // and reports the truncation here instead of GitAuthority; false when untouched.
  bool did_hit_limit = 2;
}

message GitHistoryServiceBranchDiffRequest {
  string worktree = 1;
  string file_path = 2;
  optional string old_path = 3;
  string merge_base = 4;
  string head_oid = 5;
}

message GitHistoryServiceBranchDiffResponse {
  GitDiffResult diff = 1;
}

message GitHistoryServiceCommitCompareRequest {
  string worktree = 1;
  string commit_id = 2;
}

message GitHistoryServiceCommitCompareResponse {
  GitCompareResult compare = 1;
}

message GitHistoryServiceCommitDiffRequest {
  string worktree = 1;
  string file_path = 2;
  string commit_oid = 3;
  optional string parent_oid = 4;
  optional string old_path = 5;
}

message GitHistoryServiceCommitDiffResponse {
  GitDiffResult diff = 1;
}
