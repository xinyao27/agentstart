syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

// Why: clipboard image uploads carry binary content as base64 text exactly as
// the legacy surface did (permissive Node-matching decode, byte-identical
// limits), so the wire keeps strings rather than inventing a bytes encoding
// the chunked upload admission rules were never sized for.
service ClipboardService {
  rpc StartImageUpload(ClipboardServiceStartImageUploadRequest) returns (ClipboardServiceUploadStartedResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc AppendImageUploadChunk(ClipboardServiceAppendImageUploadChunkRequest) returns (ClipboardServiceChunkReceivedResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CommitImageUpload(ClipboardServiceCommitImageUploadRequest) returns (ClipboardServiceSavedImagePathResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc AbortImageUpload(ClipboardServiceAbortImageUploadRequest) returns (ClipboardServiceUploadAbortedResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SaveImageAsTempFile(ClipboardServiceSaveImageAsTempFileRequest) returns (ClipboardServiceSavedImagePathResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message ClipboardServiceStartImageUploadRequest {
  // Maximum base64 character count the legacy admission accepts (24 MiB).
  uint64 expected_base64_length = 1;
}

message ClipboardServiceUploadStartedResponse {
  string upload_id = 1;
}

message ClipboardServiceAppendImageUploadChunkRequest {
  string upload_id = 1;
  uint64 offset = 2;
  // Maximum base64 character count the legacy admission accepts per chunk (512 KiB).
  string content_base64 = 3;
}

message ClipboardServiceChunkReceivedResponse {
  uint64 received_base64_length = 1;
}

message ClipboardServiceCommitImageUploadRequest {
  string upload_id = 1;
}

message ClipboardServiceAbortImageUploadRequest {
  string upload_id = 1;
}

message ClipboardServiceUploadAbortedResponse {
  bool aborted = 1;
}

message ClipboardServiceSaveImageAsTempFileRequest {
  string content_base64 = 1;
}

// Why: the response carries the legacy OS-temp filename shape (`agentstart-paste-<ms>-<uuid>.png`)
// as a platform path, which only makes sense as a string.
message ClipboardServiceSavedImagePathResponse {
  string path = 1;
}
