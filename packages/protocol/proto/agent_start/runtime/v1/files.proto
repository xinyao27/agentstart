syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

// Why: `Unwatch` has no RPC here. A protobuf watch is a native server-streaming
// call, so cancellation is the caller closing that stream rather than a
// second request naming a subscription id (see Watch/WatchLogTail below).
service FilesService {
  rpc BrowseServerDirectory(FilesServiceBrowseServerDirectoryRequest) returns (FilesServiceBrowseServerDirectoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

