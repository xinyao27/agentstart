}

message FilesServiceOpenDiffRequest {
  string worktree = 1;
  string relative_path = 2;
  bool staged = 3;
}

message FilesServiceOpenDiffResponse {
  FileOpenResult result = 1;
}

message FilesServiceReadRequest {
