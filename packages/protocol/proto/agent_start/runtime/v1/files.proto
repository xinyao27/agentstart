enum FileKind {
  FILE_KIND_UNSPECIFIED = 0;
  FILE_KIND_TEXT = 1;
  FILE_KIND_BINARY = 2;
  FILE_KIND_IMAGE = 3;
  FILE_KIND_MARKDOWN = 4;
}

enum FileChangeKind {
  FILE_CHANGE_KIND_UNSPECIFIED = 0;
  FILE_CHANGE_KIND_CREATE = 1;
  FILE_CHANGE_KIND_DELETE = 2;
  FILE_CHANGE_KIND_UPDATE = 3;
  FILE_CHANGE_KIND_OVERFLOW = 4;
}

enum LogTailChangeKind {
  LOG_TAIL_CHANGE_KIND_UNSPECIFIED = 0;
  LOG_TAIL_CHANGE_KIND_RENAME = 1;
  LOG_TAIL_CHANGE_KIND_CHANGE = 2;
}

// A terminal artifact grant is redeemed against whichever host executes the
// owning worktree; the workbench uses this only to label the origin.
enum TerminalArtifactProvider {
  TERMINAL_ARTIFACT_PROVIDER_UNSPECIFIED = 0;
  TERMINAL_ARTIFACT_PROVIDER_LOCAL = 1;
  TERMINAL_ARTIFACT_PROVIDER_SSH = 2;
}

message FileListEntry {
  string basename = 1;
  FileKind kind = 2;
  string relative_path = 3;
}

message FileListResult {
  repeated FileListEntry files = 1;
  string root_path = 2;
  uint64 total_count = 3;
  bool truncated = 4;
  string worktree = 5;
}

message FileOpenResult {
  FileKind kind = 1;
  bool opened = 2;
  string relative_path = 3;
  string worktree = 4;
}

message FileReadResult {
  string content = 1;
  uint64 byte_length = 2;
  bool truncated = 3;
  string relative_path = 4;
  string worktree = 5;
}

// `content` carries UTF-8 text when `is_binary` is false, the raw previewable
// bytes (image/PDF) when `is_binary` and `mime_type` are both set, and is
// empty when the file is binary but has no supported preview mime type.
message FilePreviewResult {
  bytes content = 1;
  bool is_binary = 2;
  optional bool is_image = 3;
  optional string mime_type = 4;
}

message MutationResult {
  bool ok = 1;
}

message DirectoryEntry {
  string name = 1;
  bool is_directory = 2;
  bool is_symlink = 3;
}

message SearchMatch {
  uint32 line = 1;
  uint32 column = 2;
  uint32 match_length = 3;
  string line_content = 4;
  optional uint32 display_column = 5;
  optional uint32 display_match_length = 6;
}

message SearchFileResult {
  string file_path = 1;
  string relative_path = 2;
  uint32 match_count = 3;
  repeated SearchMatch matches = 4;
}

message MarkdownDocument {
  string basename = 1;
  string file_path = 2;
  string name = 3;
  string relative_path = 4;
}

message WorktreeFileTarget {
  string absolute_path = 1;
  string relative_path = 2;
  TerminalArtifactProvider provider = 3;
}

message AbsoluteFileTarget {
  string absolute_path = 1;
  string grant_id = 2;
  TerminalArtifactProvider provider = 3;
}

message TerminalOpenTarget {
  oneof target {
    WorktreeFileTarget worktree_file = 1;
    AbsoluteFileTarget absolute_file = 2;
  }
}

message FileChangeEvent {
  FileChangeKind kind = 1;
  string absolute_path = 2;
  optional string old_absolute_path = 3;
  optional bool is_directory = 4;
}

message FilesServiceBrowseServerDirectoryRequest {
  string path = 1;
}

message FilesServiceBrowseServerDirectoryResponse {
  repeated DirectoryEntry entries = 1;
  string resolved_path = 2;
}

message FilesServiceListRequest {
