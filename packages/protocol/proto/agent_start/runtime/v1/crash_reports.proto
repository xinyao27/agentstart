syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

// Mirrors apps/daemon/src/crash-reporting/*: local-only crash capture, redaction, and
// user-initiated submission for the browser workbench (Help > Report Crash, the crash
// banner, and renderer/terminal error boundaries).
service CrashReportsService {
  rpc GetLatestPending(CrashReportsServiceGetLatestPendingRequest)
      returns (CrashReportsServiceGetLatestPendingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc GetLatestReport(CrashReportsServiceGetLatestReportRequest)
      returns (CrashReportsServiceGetLatestReportResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Dismiss(CrashReportsServiceDismissRequest) returns (CrashReportsServiceDismissResponse) {
    option idempotency_level = IDEMPOTENT;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RecordBreadcrumb(CrashReportsServiceRecordBreadcrumbRequest)
      returns (CrashReportsServiceRecordBreadcrumbResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc RecordRendererError(CrashReportsServiceRecordRendererErrorRequest)
      returns (CrashReportsServiceRecordRendererErrorResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Submit(CrashReportsServiceSubmitRequest) returns (CrashReportsServiceSubmitResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CopyLatestDiagnostics(CrashReportsServiceCopyLatestDiagnosticsRequest)
      returns (CrashReportsServiceCopyLatestDiagnosticsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

enum CrashReportStatus {
  CRASH_REPORT_STATUS_UNSPECIFIED = 0;
  CRASH_REPORT_STATUS_PENDING = 1;
  CRASH_REPORT_STATUS_SENT = 2;
  CRASH_REPORT_STATUS_DISMISSED = 3;
}

enum CrashReportSource {
  CRASH_REPORT_SOURCE_UNSPECIFIED = 0;
  CRASH_REPORT_SOURCE_RENDERER = 1;
  CRASH_REPORT_SOURCE_CHILD = 2;
}

// One scalar detail/breadcrumb-data value. Mirrors the TypeScript union
// `string | number | boolean | null` (CrashReportDetailValue); `kind` unset means the
// field was never populated (there is no bare "unset" variant distinct from
// CrashReportDetailNull, which is the explicit-null case).
message CrashReportDetailValue {
  oneof kind {
    string string_value = 1;
    double number_value = 2;
    bool bool_value = 3;
    CrashReportDetailNull null_value = 4;
  }
}

message CrashReportDetailNull {}

message CrashReportDetails {
  map<string, CrashReportDetailValue> entries = 1;
}

message CrashReportBreadcrumb {
  string created_at = 1;
  string name = 2;
  CrashReportDetails data = 3;
}

message CrashReport {
  string id = 1;
  string created_at = 2;
  CrashReportStatus status = 3;
  CrashReportSource source = 4;
  string process_type = 5;
  string reason = 6;
  optional int64 exit_code = 7;
  string app_version = 8;
  string platform = 9;
  string os_release = 10;
  string arch = 11;
  string chrome_version = 12;
  CrashReportDetails details = 13;
  repeated CrashReportBreadcrumb breadcrumbs = 14;
}

// Tri-state string used where the TypeScript field is `string | null | undefined`:
// the field is absent (undefined, leave as-is), present with `null` (explicit clear),
// or present with `text` (new value).
message CrashReportNullableString {
  oneof value {
    string text = 1;
    bool null = 2;
  }
}

message CrashReportsServiceGetLatestPendingRequest {}

message CrashReportsServiceGetLatestPendingResponse {
  optional CrashReport report = 1;
}

message CrashReportsServiceGetLatestReportRequest {}

message CrashReportsServiceGetLatestReportResponse {
  optional CrashReport report = 1;
}

message CrashReportsServiceDismissRequest {
  string report_id = 1;
}

message CrashReportsServiceDismissResponse {
  optional CrashReport report = 1;
}

message CrashReportsServiceRecordBreadcrumbRequest {
  string name = 1;
  CrashReportDetails data = 2;
}

message CrashReportsServiceRecordBreadcrumbResponse {}

enum RendererErrorReportKind {
  // Unspecified is Bun's own fallback default (any unrecognized kind normalizes to
  // react-error-boundary), not a rejection case.
  RENDERER_ERROR_REPORT_KIND_UNSPECIFIED = 0;
  RENDERER_ERROR_REPORT_KIND_REACT_ERROR_BOUNDARY = 1;
  RENDERER_ERROR_REPORT_KIND_RENDERER_UNHANDLED_ERROR = 2;
  RENDERER_ERROR_REPORT_KIND_TERMINAL_ERROR = 3;
}

enum RendererErrorSurface {
  RENDERER_ERROR_SURFACE_UNSPECIFIED = 0;
  RENDERER_ERROR_SURFACE_APP_ROOT = 1;
  RENDERER_ERROR_SURFACE_WEB_ROOT = 2;
  RENDERER_ERROR_SURFACE_WORKSPACE_SHELL = 3;
  RENDERER_ERROR_SURFACE_SIDEBAR = 4;
  RENDERER_ERROR_SURFACE_TERMINAL_WORKBENCH = 5;
  RENDERER_ERROR_SURFACE_RIGHT_SIDEBAR = 6;
  RENDERER_ERROR_SURFACE_PAGE = 7;
  RENDERER_ERROR_SURFACE_MODAL = 8;
  RENDERER_ERROR_SURFACE_OVERLAY = 9;
  RENDERER_ERROR_SURFACE_RICH_MARKDOWN_EDITOR = 10;
}

message CrashReportsServiceRecordRendererErrorRequest {
  RendererErrorReportKind kind = 1;
  string origin_id = 2;
  RendererErrorSurface surface = 3;
  optional string error_name = 4;
  optional string error_message = 5;
  optional string error_stack = 6;
  optional string component_stack = 7;
  optional string active_view = 8;
  CrashReportNullableString active_modal = 9;
  CrashReportNullableString active_tab_type = 10;
  CrashReportNullableString active_right_sidebar_tab = 11;
  optional bool has_active_worktree = 12;
  optional string chrome_version = 13;
}

message CrashReportsServiceRecordRendererErrorResponse {
  oneof result {
    RendererErrorReportSuccess success = 1;
    string error = 2;
  }
}

message RendererErrorReportSuccess {
  optional CrashReport report = 1;
  bool deduped = 2;
}

message CrashReportsServiceSubmitRequest {
  optional string report_id = 1;
  optional string notes = 2;
  // Absent means "attach diagnostics" — Bun's default is `includeDiagnosticLogs !== false`.
  optional bool include_diagnostic_logs = 3;
  optional bool submit_anonymously = 4;
  optional string github_login = 5;
  optional string github_email = 6;
  optional string chrome_version = 7;
}

message CrashReportsServiceSubmitResponse {
  oneof result {
    CrashReportSubmitSuccess success = 1;
    CrashReportSubmitFailure failure = 2;
  }
}

message CrashReportSubmitSuccess {
  optional CrashReport report = 1;
  optional CrashReportDiagnosticBundle diagnostic_bundle = 2;
}

message CrashReportSubmitFailure {
  optional int32 status = 1;
  string error = 2;
  optional CrashReport report = 3;
  optional CrashReportDiagnosticBundle diagnostic_bundle = 4;
}

message CrashReportDiagnosticBundle {
  oneof status {
    CrashReportDiagnosticBundleAttached attached = 1;
    CrashReportDiagnosticBundleNotUploaded not_uploaded = 3;
  }
}

message CrashReportDiagnosticBundleAttached {
  string bundle_submission_id = 1;
  uint64 bytes = 2;
  uint32 span_count = 3;
}

message CrashReportDiagnosticBundleNotUploaded {
  string reason = 1;
  optional string bundle_submission_id = 2;
  optional uint64 bytes = 3;
  optional uint32 span_count = 4;
}

message CrashReportsServiceCopyLatestDiagnosticsRequest {
  optional string report_id = 1;
  optional string notes = 2;
  optional CrashReportCopySubmissionFailure submission_failure = 3;
}

message CrashReportCopySubmissionFailure {
  string error = 1;
  oneof diagnostic_context {
    CrashReportCopyDiagnosticUploaded uploaded = 2;
    CrashReportCopyDiagnosticNotUploaded not_uploaded = 3;
  }
}

message CrashReportCopyDiagnosticUploaded {
  string ticket_id = 1;
}

message CrashReportCopyDiagnosticNotUploaded {
  string reason = 1;
}

message CrashReportsServiceCopyLatestDiagnosticsResponse {
  oneof result {
    string text = 1;
    string error = 2;
  }
}
