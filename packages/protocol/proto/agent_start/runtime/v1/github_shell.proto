syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service GitHubShellService {
  rpc GetViewer(GitHubShellServiceGetViewerRequest) returns (GitHubShellServiceGetViewerResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc EnqueuePrRefresh(GitHubShellServiceEnqueuePrRefreshRequest) returns (GitHubShellServiceEnqueuePrRefreshResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc ReportVisiblePrRefreshCandidates(GitHubShellServiceReportVisiblePrRefreshCandidatesRequest) returns (GitHubShellServiceReportVisiblePrRefreshCandidatesResponse) {
    option idempotency_level = IDEMPOTENT;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc CheckAgentStartStarred(GitHubShellServiceCheckAgentStartStarredRequest) returns (GitHubShellServiceCheckAgentStartStarredResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc StarAgentStart(GitHubShellServiceStarAgentStartRequest) returns (GitHubShellServiceStarAgentStartResponse) {
    option idempotency_level = IDEMPOTENT;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_HOST
      tier: ACCESS_TIER_HOST
      callers: CALLER_CLASS_LOCAL
      peer_kinds: PEER_KIND_CHROME_EXTENSION
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_LOCAL_ONLY
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message GitHubShellServiceGetViewerRequest {}

message GitHubShellServiceGetViewerResponse {
  optional GitHubViewer viewer = 1;
}

message GitHubViewer {
  string login = 1;
  optional string email = 2;
}

message GitHubShellServiceEnqueuePrRefreshRequest {
  GitHubPrRefreshCandidate candidate = 1;
  GitHubPrRefreshReason reason = 2;
  optional sint32 priority = 3;
}

message GitHubShellServiceEnqueuePrRefreshResponse {
  GitHubPrRefreshEnqueueKind kind = 1;
  optional GitHubPrRefreshValidationSkip skipped_reason = 2;
}

enum GitHubPrRefreshEnqueueKind {
  GIT_HUB_PR_REFRESH_ENQUEUE_KIND_UNSPECIFIED = 0;
  GIT_HUB_PR_REFRESH_ENQUEUE_KIND_QUEUED = 1;
  GIT_HUB_PR_REFRESH_ENQUEUE_KIND_SKIPPED = 2;
  GIT_HUB_PR_REFRESH_ENQUEUE_KIND_FALLBACK = 3;
  GIT_HUB_PR_REFRESH_ENQUEUE_KIND_UNAVAILABLE = 4;
}

enum GitHubPrRefreshValidationSkip {
  GIT_HUB_PR_REFRESH_VALIDATION_SKIP_UNSPECIFIED = 0;
  GIT_HUB_PR_REFRESH_VALIDATION_SKIP_DENIED = 1;
  GIT_HUB_PR_REFRESH_VALIDATION_SKIP_BACKOFF = 2;
}

message GitHubShellServiceReportVisiblePrRefreshCandidatesRequest {
  repeated GitHubPrRefreshCandidate candidates = 1;
  double generation = 2;
}

message GitHubShellServiceReportVisiblePrRefreshCandidatesResponse {
  bool accepted = 1;
}

message GitHubShellServiceCheckAgentStartStarredRequest {}

message GitHubShellServiceCheckAgentStartStarredResponse {
  optional bool starred = 1;
}

message GitHubShellServiceStarAgentStartRequest {
  AppStarSource source = 1;
}

message GitHubShellServiceStarAgentStartResponse {
  bool starred = 1;
}

message GitHubPrRefreshCandidate {
  string cache_key = 1;
  string repo_id = 2;
  string repo_path = 3;
  ProjectRepositoryKind repo_kind = 4;
  string branch = 5;
  optional string worktree_id = 6;
  optional string current_head_oid = 7;
  optional uint64 linked_pr_number = 8;
  optional uint64 fallback_pr_number = 9;
  optional GitHubPrRefreshFallbackSource fallback_pr_source = 10;
  bool is_bare = 11;
  bool is_archived = 12;
  optional double cached_fetched_at_ms = 13;
  optional bool cached_has_pr = 14;
  optional GitHubPrState cached_pr_state = 15;
  optional GitHubPrChecksStatus cached_checks_status = 16;
  optional GitHubPrMergeable cached_mergeable = 17;
  optional string cached_merge_state_status = 18;
}

enum ProjectRepositoryKind {
  PROJECT_REPOSITORY_KIND_UNSPECIFIED = 0;
  PROJECT_REPOSITORY_KIND_GIT = 1;
  PROJECT_REPOSITORY_KIND_FOLDER = 2;
}

enum GitHubPrRefreshReason {
  GIT_HUB_PR_REFRESH_REASON_UNSPECIFIED = 0;
  GIT_HUB_PR_REFRESH_REASON_VISIBLE = 1;
  GIT_HUB_PR_REFRESH_REASON_ACTIVE = 2;
  GIT_HUB_PR_REFRESH_REASON_POST_PUSH = 3;
  GIT_HUB_PR_REFRESH_REASON_MANUAL = 4;
  GIT_HUB_PR_REFRESH_REASON_SWR = 5;
}

enum GitHubPrRefreshFallbackSource {
  GIT_HUB_PR_REFRESH_FALLBACK_SOURCE_UNSPECIFIED = 0;
  GIT_HUB_PR_REFRESH_FALLBACK_SOURCE_EXPLICIT = 1;
  GIT_HUB_PR_REFRESH_FALLBACK_SOURCE_PR_CACHE = 2;
  GIT_HUB_PR_REFRESH_FALLBACK_SOURCE_HOSTED_REVIEW = 3;
}

enum GitHubPrState {
  GIT_HUB_PR_STATE_UNSPECIFIED = 0;
  GIT_HUB_PR_STATE_OPEN = 1;
  GIT_HUB_PR_STATE_CLOSED = 2;
  GIT_HUB_PR_STATE_MERGED = 3;
  GIT_HUB_PR_STATE_DRAFT = 4;
}

enum GitHubPrChecksStatus {
  GIT_HUB_PR_CHECKS_STATUS_UNSPECIFIED = 0;
  GIT_HUB_PR_CHECKS_STATUS_PENDING = 1;
  GIT_HUB_PR_CHECKS_STATUS_SUCCESS = 2;
  GIT_HUB_PR_CHECKS_STATUS_FAILURE = 3;
  GIT_HUB_PR_CHECKS_STATUS_NEUTRAL = 4;
}

enum GitHubPrMergeable {
  GIT_HUB_PR_MERGEABLE_UNSPECIFIED = 0;
  GIT_HUB_PR_MERGEABLE_MERGEABLE = 1;
  GIT_HUB_PR_MERGEABLE_CONFLICTING = 2;
  GIT_HUB_PR_MERGEABLE_UNKNOWN = 3;
}

enum AppStarSource {
  APP_STAR_SOURCE_UNSPECIFIED = 0;
  APP_STAR_SOURCE_STAR_NAG = 1;
  APP_STAR_SOURCE_AGENT_VALUE_MOMENT = 2;
  APP_STAR_SOURCE_ONBOARDING_COMPLETED = 3;
  APP_STAR_SOURCE_SETTINGS = 4;
  APP_STAR_SOURCE_LANDING = 5;
}
