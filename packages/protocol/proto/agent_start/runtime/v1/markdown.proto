syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service MarkdownService {
  rpc ReadTab(MarkdownServiceReadTabRequest) returns (MarkdownServiceReadTabResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc SaveTab(MarkdownServiceSaveTabRequest) returns (MarkdownServiceSaveTabResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_WORKTREE
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      callers: CALLER_CLASS_MOBILE
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
      peer_kinds: PEER_KIND_IOS_APP
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message MarkdownServiceReadTabRequest {
  string worktree = 1;
  string tab_id = 2;
}

enum MarkdownSource {
  MARKDOWN_SOURCE_UNSPECIFIED = 0;
  MARKDOWN_SOURCE_DRAFT = 1;
  MARKDOWN_SOURCE_FILE = 2;
}

enum MarkdownReadOnlyReason {
  MARKDOWN_READ_ONLY_REASON_UNSPECIFIED = 0;
  MARKDOWN_READ_ONLY_REASON_UNSUPPORTED_PREVIEW = 1;
  MARKDOWN_READ_ONLY_REASON_UNSUPPORTED_TAB = 2;
  MARKDOWN_READ_ONLY_REASON_UNSUPPORTED_UNTITLED = 3;
  MARKDOWN_READ_ONLY_REASON_FILE_TOO_LARGE = 4;
}

message MarkdownServiceReadTabResponse {
  string tab_id = 1;
  string file_path = 2;
  string relative_path = 3;
  string content = 4;
  bool is_dirty = 5;
  string version = 6;
  MarkdownSource source = 7;
  bool editable = 8;
  optional MarkdownReadOnlyReason read_only_reason = 9;
}

message MarkdownServiceSaveTabRequest {
  string worktree = 1;
  string tab_id = 2;
  string base_version = 3;
  string content = 4;
}

message MarkdownServiceSaveTabResponse {
  string tab_id = 1;
  string version = 2;
  bool is_dirty = 3;
  string content = 4;
}
