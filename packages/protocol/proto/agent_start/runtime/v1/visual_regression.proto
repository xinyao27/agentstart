syntax = "proto3";

package agent_start.runtime.v1;

import "agent_start/protocol/v1/annotations.proto";

service VisualRegressionService {
  rpc Latest(VisualRegressionServiceLatestRequest) returns (VisualRegressionServiceCaptureResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_READ
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }

  rpc Save(VisualRegressionServiceSaveRequest) returns (VisualRegressionServiceCaptureResponse) {
    option (agent_start.protocol.v1.method_policy) = {
      scope: ACCESS_SCOPE_PROJECT
      tier: ACCESS_TIER_CONTROL
      callers: CALLER_CLASS_LOCAL
      callers: CALLER_CLASS_RUNTIME
      peer_kinds: PEER_KIND_CHROME_EXTENSION
      peer_kinds: PEER_KIND_CLI
      peer_kinds: PEER_KIND_DAEMON
    };
    option (agent_start.protocol.v1.method_transport_policy) = {
      route: RUNTIME_ROUTE_POLICY_ENVIRONMENT_ALLOWED
      stream_reconnect: STREAM_RECONNECT_POLICY_FAIL
    };
  }
}

message VisualRegressionServiceLatestRequest {
  string page_url = 1;
  string project_id = 2;
  string worktree_id = 3;
}

message VisualRegressionServiceSaveRequest {
  string page_url = 1;
  string project_id = 2;
  string worktree_id = 3;
  // Why: the legacy surface requires diffRatio to be present but nullable,
  // so the wrapper keeps "explicit null" distinct from "field absent".
  VisualRegressionDiffRatio diff_ratio = 4;
  int64 width = 5;
  int64 height = 6;
  string image_artifact_id = 7;
}

message VisualRegressionDiffRatio {
  oneof value {
    bool null = 1;
    double ratio = 2;
  }
}

message VisualRegressionServiceCaptureResponse {
  VisualRegressionCapture capture = 1;
}

message VisualRegressionCapture {
  string id = 1;
  string page_url = 2;
  string project_id = 3;
  string worktree_id = 4;
  // Why: the legacy JSON emits "diffRatio": null for captures without a diff,
  // so an unset optional field carries exactly that null.
  optional double diff_ratio = 5;
  int64 width = 6;
  int64 height = 7;
  string image_artifact_id = 8;
  int64 created_at = 9;
}
